### Qwen3-VL SFT LoRA Example Configuration
### Usage: python train.py examples/qwen3_vl_sft_lora.yaml

# ====== Model ======
model_name_or_path: Qwen/Qwen3-VL-4B-Instruct
trust_remote_code: true
# flash_attn: fa2
compute_dtype: bfloat16
device_map: auto

# Processor / multimodal
image_max_pixels: 147456
image_min_pixels: 1024     # 32*32
video_max_pixels: 65536    # 256*256
video_min_pixels: 256      # 16*16
video_fps: 1.0
video_maxlen: 128

# ====== Data ======
dataset: mllm_demo              # name(s) in dataset_info.json, comma-separated
dataset_dir: ../../../../dataset                # directory containing dataset_info.json
template: qwen3_vl_nothink
cutoff_len: 2048
train_on_prompt: false
preprocessing_num_workers: 4
overwrite_cache: false
val_size: 0.0                    # set > 0 for a validation split, e.g. 0.05

# ====== Training ======
output_dir: output/qwen3_vl_sft
do_train: true
do_eval: false
num_train_epochs: 1.0
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 5.0e-6
weight_decay: 0.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0
logging_steps: 10
save_steps: 100
seed: 42
bf16: true
gradient_checkpointing: true
report_to: none
dataloader_num_workers: 0

# ====== LoRA ======
finetuning_type: full
# lora_rank: 8
# lora_alpha: 16
# lora_dropout: 0.0
# lora_target: all                 # "all" for all linear layers, or comma-separated module names
# use_rslora: false
# use_dora: false
freeze_vision_tower: true
freeze_multi_modal_projector: true

