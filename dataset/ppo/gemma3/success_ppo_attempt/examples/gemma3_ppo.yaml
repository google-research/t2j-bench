### Model
model_name_or_path: google/gemma-3-4b-it
compute_dtype: bfloat16

### Image processing
image_max_pixels: 589824  # 768*768
image_min_pixels: 1024    # 32*32

### Data
dataset: ppo_demo
dataset_dir: data
template: gemma3
cutoff_len: 512
max_samples: 50

### Training
output_dir: output/gemma3_ppo
do_train: true
num_train_epochs: 1.0
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-6
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0
logging_steps: 1
save_steps: 100
bf16: true
gradient_checkpointing: true

### Finetuning
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
freeze_vision_tower: true
freeze_multi_modal_projector: true

### PPO
ppo_epochs: 4
ppo_buffer_size: 1
cliprange: 0.2
cliprange_value: 0.2
vf_coef: 0.1
gamma: 1.0
lam: 0.95
kl_coef: 0.05

### Reward model (API-based)
reward_model: http://localhost:8000/v1/chat/completions
reward_model_type: api

### Generation
do_sample: true
temperature: 0.95
top_p: 0.7
top_k: 50
max_new_tokens: 256
