  # freezer's `--check` reports `unchanged` across it. The
  # eight margins listed above are unaffected: they are read off the generation
  # artifacts, and only index 0 is ever taken from the ragged forward.
  #
  # GUARDED, not just described: the harness
  # asserts the cross-artifact invariant -- the row `decode_margins[0]` reads MUST
  # be the row that produced `generation.npz::tokens[0]`. Those two are frozen by
  # different freezer steps, so their agreement is a real check rather than a
  # restatement.
  #
  # THE THIRD CONSUMER IS STILL OPEN: the parity checks certify a sampler row
  # chosen the same way, so they grade a different row from the one the grade
  # uses. Class-wide audit.
  decisive_margin: 0.125
