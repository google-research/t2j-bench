  # and on the fp32 tier:
  #     cosine_floor  0.999999  raw cosine 0.99999994 = 1.0 float32 quantum
  #                             against a 16.78-quantum budget           -> 16.8x
  #     max_kl        1.0e-4    worst token KL 1.109524e-06              -> 90.1x
  #     argmax_margin 0.0       floor 0.0, 13 rows, no disagreement
  # `rel_tol` is uncalibrated on both tiers and binding on the wide surfaces;
