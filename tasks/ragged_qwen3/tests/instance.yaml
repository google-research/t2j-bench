  # AND THE DERIVED LIST MATCHES THE DOCUMENTED ONE, which is the cheapest
  # available corroboration: `decode_margins` reads
  # 0.5 6.0 3.125 3.25 1.125 2.3125 5.25 0.625, element for element THE EIGHT
  # GENERATION-ALIGNED GOLDEN MARGINS written above. A `[-1]` read would make
  # index 0 read 3.125 and the two lists would disagree in exactly the one place
  # the trap touches.
  #
  # WHY IT IS LATENT HERE AND NOT LIVE. `test_greedy_sequence` excuses a
  # divergence at generated step i only when the golden's own margin at i is
  # BELOW this key. 3.125 and 0.5 are both far above 0.125, so on THIS instance
  # the wrong row made the check no stricter and no looser -- the honest 0.5 is
  # still 4x decisive. That is a property of this prompt, not a general
  # exemption: on ragged_llama3 the same assumption reads 4.0000 where the honest
  # value is 0.3750, a genuine bf16 near-tie, where it would silently fail
