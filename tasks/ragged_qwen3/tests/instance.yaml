  #
  # ===========================================================================
  # A GATE CONSTANT ENFORCING A GRADED KEY ON A SURFACE THE GRADE NEVER APPLIES
  # IT TO -- recorded here because this is the file that owns both halves, and
  # DELIBERATELY NOT FIXED IN THIS ROUND.
  #
  # The parity checks set `KV_ATOL = FP32.abs_tol`, i.e.
  # this file's `fp32_thresholds.abs_tol`, and apply it with `KV_RTOL = 0.0`
  # to three full-tensor fp32 KV comparisons. All three are RED on this
  # instance, at 3.967285e-04 against 1.0e-4 -- and the same three facts were
  # established by measurement rather than argued:
  #   * all three surfaces (prefill cache, post-generate cache, ragged cache)
  #     read that value TO THE LAST DIGIT, so the mixed batch adds nothing;
  #   * the UNMODIFIED core_qwen3 tree measures the
  #     BIT-IDENTICAL 3.967285e-04 and is equally red, pinned and unpinned;
  #   * there is no fp32-tier `kv_cache_state` graded check at all. The only
  #     graded KV comparison is native-tier at `abs_tol.kv_cache_state`, whose
  #     floor is 0.780859 above -- about 5 000x looser than what this gate
  #     demands of the same physical quantity.
  # `abs_tol`'s own GRADED binding surface, measured above, is
  # `reference_units/lm_head.out0`, where |ref| <= 24.23. The KV cache peaks at
  # 419.365 in fp32, two binades higher. One constant cannot be a floor for
  # both, and tightening `abs_tol` for the surfaces it does grade is what took
  # the non-graded one red.
  #
  # DO NOT "FIX" THIS BY LOOSENING `abs_tol`. That would widen the graded fp32
  # array band 4x for every surface that needs 20x less of it, to move a
  # PRE-FREEZE diagnostic that is failing in the safe direction.
  #
  # THE VALUE IS UN-NORMALISED, AND THAT IS THE WHOLE DEFECT. The comparison
  # that carries it is across FAMILIES: the `llama3` column measures 3.338e-05
  # against a max|kv| of 17.31 and PASSES the same constant at 3.00x, while the
  # `qwen3` column measures 3.967285e-04 against 419.365 and fails at 3.97x.
  # Normalised by the array's own maximum those two floors are 1.93e-06 and
  # 9.46e-07 -- 2.038x apart -- while the RAW floors differ by 11.9x. The class
  # already writes down the right normaliser and then does not use it: the
  # llama3 block derives `2 * log2(hidden_size) * 2^-23 * max|kv|` as the
  # reduction-order bound, which gives 9.998e-04 here (measured / predicted
  # 0.40) and 4.540e-05 there (0.74). One formula spans the family axis; one
  # flat constant is 3.0x slack on llama3 and 3.97x tight on qwen3.
  #
  #   AND A SUGGESTIVE IDENTITY THAT IS NOT A DERIVATION, flagged so it is not
  #   over-read: 3.967285e-04 is EXACTLY 13 x 2^-15, the fp32 ULP of the
  #   [256, 512) binade max|kv| lives in. Exact divisibility is necessary but
  #   not sufficient for the binding ELEMENT to sit in that binade, and this
  #   round did not measure which element attains it -- the llama3 block's
  #   analogous figure works out to 35 ULPs of a 9.75 element, not of its array
  #   max, and that block's own reading is that the disagreement scales with the
  #   ARRAY's magnitude rather than each element's (its worst-budget element is
  #   |kv| = 0.109). The normalised two-column comparison above is what carries
  #   the conclusion; the divisibility is a coincidence worth a second look.
  #
  #   THE ATTRIBUTION, because the numbers are easy to hang on the wrong
  #   instance: 3.338e-05, 17.31 and the 3.00x are labelled in ragged_llama3's
  #   own file as a core_llama3 measurement. They are a
  #   `llama3`-FAMILY reading carried into that instance's file, not a
  #   ragged_llama3 measurement -- and 17.31 is a fp32 parity peak, not to be
  #   compared against ragged_llama3's native `kv_cache_state` peak of 17.125,
  #   which is a different tier.
  #
  # THE SHAPE OF THE FIX, stated rather than made, because this is a class-wide
  # constant in a file every instance carries: (1) DECOUPLE `KV_ATOL` from
  # `FP32.abs_tol` -- they grade different surfaces two binades apart, and the
  # coupling means a graded key cannot be tightened without reddening a
  # non-graded diagnostic; (2) DERIVE it in the test from the torch side's own
  # array, `C * 2 * log2(hidden_size) * 2^-23 * max|ref_kv|`, with C measured
  # across the class (0.40 and 0.74 on the two columns that have taken it, so
  # C = 1.0 leaves 2.5x here and 1.4x on llama3, and C = 1.5 leaves 3.8x and
  # 2.0x); (3) do NOT introduce an fp32 `kv_cache_state` key in this file to
  # hang it on -- there is no fp32 KV check in the GRADE, so a key here would be
  # a threshold nothing graded reads, which is the failure the class-wide
  # symmetry gate exists to catch.
  #
  # ONE CLAIM IN THE PARITY CHECKS' OWN BLOCK IS UNSUPPORTED and is corrected here
  # rather than silently reproduced: it says ragged_llama3 "records only TWO
  # failures, because its ragged clause passes". Nothing in ragged_llama3's file
  # records a per-clause failure count taken on ITS tree; what it records is the
  # core_llama3 floor of 3.338e-05 at 3.00x, i.e. a llama3-family reading that
  # is comfortably inside the band. So "two failures" is not established, and
  # neither is "all three pass" -- the honest statement is that the llama3
  # column's KV floor is 12x below qwen3's and the constant only fails on one of
  # them. The conclusion the block draws -- that the axis is the checkpoint and
  # not the mode -- survives, and is strengthened.
  # ===========================================================================

# Sampler grid -- FIVE POINTS, core_qwen3's STRUCTURE with TWO `top_p` VALUES
# RE-SWEPT AGAINST THIS INSTANCE'S OWN FROZEN ROW. It is tempting to call the
# grid "BYTE-IDENTICAL TO core_qwen3's FIVE POINTS" because "the sampler is a
# per-token transform chain with no notion of a batch, so the mode axis cannot
# move it". THE PREMISE IS TRUE AND THE CONCLUSION IS FALSE,
# and the gap between them is the whole finding below: the mode axis does not
# move the sampler, but it DOES move which row the sampler is evaluated ON, and
# a grid is only screenable against a row.
#
# ===========================================================================
# WHY THE INHERITED GRID HAD TO MOVE -- MEASURED ON THE FROZEN
# `golden/sampler.npz`, NOT PREDICTED.
#
# the freezer takes the sampler's input as
# `logits[-1]` OF THE GRADED FORWARD (`self._prefill_last_logits`). On a `core`
# instance that is sequence 0's last prompt row -- which is what core_qwen3
# screened its five points against. ON A RAGGED BATCH IT IS THE LAST REQUEST'S
# SINGLE DECODE TOKEN: `query_start_loc` is [0, 11, 12, 13], so row 12 is
# sequence 2's, "In the beginning God created the heavens and the".
#
# THE FROZEN ROW, read straight off `golden/sampler.npz::logits`:
#     argmax          9393 (" earth") -- sequence 2's continuation, confirming
#                     the row identity above rather than assuming it
#     top-1 PROB      0.895684
#     top1-top2 gap   3.125 (logits 19.875 / 16.750)
#     cumulative mass 0.8957 / 0.9350 / 0.9561 / 0.9777(5) / 0.9897(10)
# That is the same property that makes sequence 2 a GOOD choice for
# `test_batching_invariance` (see the `sequences` block: its 3.125 lone-leg
# margin is what stops that check coin-flipping on a bf16 tie) working against
# this one. A repair to one check degrading another, exactly as
# `test_the_sampler_grid_makes_chain_ORDER_observable`'s own docstring warns.
#
# WHAT core_qwen3's FIVE POINTS DO ON THAT ROW -- keep counts and, per
# alternate chain order, cells whose SURVIVAL differs from the canonical
# temperature -> top_k -> top_p:
#     grid[0] {t=1.0, k=0,  p=1.0 }  keep 151936   t->p->k 0   k->p->t 0
#     grid[1] {t=1.0, k=0,  p=0.91}  keep      2   t->p->k 0   k->p->t 0
#     grid[2] {t=0.7, k=50, p=1.0 }  keep     50   t->p->k 0   k->p->t 0
#     grid[3] {t=1.0, k=50, p=0.9 }  keep      2   t->p->k 0   k->p->t 0
#     grid[4] {t=0.7, k=0,  p=0.9 }  keep      1   t->p->k 0   k->p->t 1
#   TOTALS  t->p->k 0 cells, k->p->t 1 cell.
# So `test_the_sampler_grid_makes_chain_ORDER_observable` was RED the moment
# the goldens existed ("no grid point distinguishes the canonical chain from
# ['t->p->k']"), and grid[4] had collapsed to ONE surviving token -- a
# one-token mask is invariant under every permutation of the three transforms,
# so it grades nothing about order at all. NOTE WHAT WOULD STILL HAVE PASSED:
# `test_sampler_transforms` grades the three transforms individually and would
# not have noticed their ORDER was ungraded on this instance.
#
# THE MECHANISM IS MODE-GENERAL, NOT A FAMILY QUIRK. The sibling ragged_qwen2
# measured the same collapse independently (top-1 prob 0.9736, three of six
# points dead). And ragged_llama3's own file claims its grid is "byte-identical
# to core_llama3's, and deliberately so" -- THAT COMMENT IS A FOSSIL: its
# values are NOT core_llama3's, so it evidently hit this same collapse,
# re-swept, and never updated the prose. Do not cite it as precedent for
# inheriting a grid.
#
# WHAT MOVED, AND HOW LITTLE. Exactly TWO fields, both `top_p`, on the two
# points that are supposed to carry the two order axes. Temperature, top_k and
# the point count are all still core_qwen3's, so the family-vs-mode comparison
# this instance exists to make is still single-variable everywhere the row
# permits it:
#     grid[3]  top_p 0.9  ->  0.993     (temperature 1.0, top_k 50 unchanged)
#     grid[4]  top_p 0.9  ->  0.985     (temperature 0.7, top_k 0  unchanged)
#
# THE RE-SWEPT GRID, ALL FOUR SCREENING CRITERIA RE-MEASURED ON THIS ROW.
# "mass margin" is criterion 2 -- the smaller of the two distances from `top_p`
# to the cumulative boundaries either side of the cut, against
# `test_no_sampler_grid_point_cuts_inside_a_tie`'s 5.0e-05 floor. "bf16" is
# criterion 4 -- the kept and dropped logits AT the cut, after temperature and
# top_k, round-to-nearest-even'd to bf16 and required to differ:
#
#   idx  t     k    p       keep   t->p->k  k->p->t  mass margin        bf16 kept/dropped
#    0  1.0    0   1.0    151936      0        0     n/a (no top_p)     n/a
#    1  1.0    0   0.91        2      0        0     1.4316e-02  286x   16.75   / 16.125
#    2  0.7   50   1.0        50      0        0     n/a (no top_p)     n/a
#    3  1.0   50   0.993      11      6        0     5.4675e-04   10.9x 13.3125 / 12.3125
#    4  0.7    0   0.985       2      0        6     5.4077e-03  108x   23.875  / 23
#   TOTALS  t->p->k 6 cells, k->p->t 6 cells -- NEITHER DIRECTION DEAD.
# No point cuts inside an exact tie; no cut boundary collides at bf16; no point
# keeps fewer than two tokens. The thinnest mass margin is grid[3]'s, 10.9x the
# floor -- and for scale, the point that once shipped and failed the oracle by
# one token had a margin of 5.4e-06, 100x smaller than this.
#
# WHY THE TWO NEW VALUES ARE THE ONES THEY ARE, since both directions had many
# feasible candidates (227 co-active points cleared every criterion in the
# sweep):
#   grid[3] {t=1.0, k=50, p=0.993} carries t->p->k. top_k and top_p must be
#     genuinely CO-ACTIVE for that order to be observable: the canonical chain
#     cuts on probabilities RENORMALISED over the k survivors, the alternate
#     cuts on the full row, and the two keep counts differ only where `p` lands
#     between the two. With this row's 0.8957 top-1 mass, anything at or below
#     p ~ 0.99 keeps so few tokens after top_k that both orders agree -- which
#     is exactly why the inherited 0.9 read zero. Held at t=1.0 (so the point
#     isolates the k/p interaction) and k=50 (core_qwen3's).
#   grid[4] {t=0.7, k=0, p=0.985} carries k->p->t. Temperature and the
#     cumulative cut do not commute: the canonical chain cuts on the SHARPENED
#     distribution, the alternate on the raw one. Held at core_qwen3's t=0.7;
#     only `p` moved, far enough that the sharpened cut keeps 2 rather than
#     collapsing to 1.
# A HIGHER-MOVEMENT GRID WAS AVAILABLE AND DELIBERATELY NOT TAKEN: points at
# t=1.5/2.0 move 40-90 cells, but they would have moved a SECOND field on each
# point for no gain the gate can read -- the gate's bar is "> 0 cells", the
# graded mask clause is exact, and mass margin is what actually protects a
# cross-framework keep count. Six cells on each axis with 10.9x and 108x of
# margin was preferred to fifty cells with less.
#
# TO RE-TAKE THESE NUMBERS: they are all static functions of
# `golden/sampler.npz` and this block, reproducible from them alone -- three
# checks, no GPU, no container.
# ===========================================================================
#
# REVERTING TO ragged_llama3's GRID WOULD SILENTLY REINTRODUCE A MEASURED BUG,
# which is the specific reason this is called out rather than left implicit.
# grid[1]'s `top_p: 0.91` below is NOT llama3's 0.985 nor a free choice: at
# top_p 0.9 on THIS checkpoint, core_qwen3's cross-framework parity
# harness found the NATIVE (bf16) tier's cumulative cut landing its boundary on
# a pair of tokens (27602, 15948; fp32 logits 13.574535369873047 and
# 13.565860748291016, gap 8.67e-03) that round to the IDENTICAL bf16 value
# (13.5625) -- verified by explicit round-to-nearest-even bit manipulation on
# the stored fp32 bits, not inferred from the gap being small. torch kept 27602
# and dropped 15948; JAX did the reverse; both kept exactly 22 tokens, so this
# was a tie-break disagreement, not a wrong count on either side. That
# collision is a property of the CHECKPOINT and the PROMPT -- both of which
# this instance holds fixed -- so it is live here too.
#
# THAT WAS NOT VISIBLE TO THE ORIGINAL THREE SCREENING CRITERIA: criterion 2
# checks the CUMULATIVE PROBABILITY margin from the top_p threshold in fp32
# arithmetic, which the point cleared by ~32x at the original p=0.9. A large
# probability-mass margin does not imply the individual LOGIT at the cut
# boundary is far from its neighbour in bf16-rounding terms. CRITERION 4 is the
# predicate that does check it: no two tokens that are ADJACENT in fp32-sorted
# rank, at a position a native-tier check can expose as a boundary or as an
# internally-ordered pair, may round to the IDENTICAL bf16 value.
#
# core_qwen3's MEASURED boundary distances on ITS row, kept for contrast with
# the table above -- these are NOT this instance's numbers and the point of
# printing them is that they do not transfer:
#   grid[1] {t=1.0, k=0,  p=0.91}: keep=27, margin 9.153e-04 above the boundary
#   grid[3] {t=1.0, k=50, p=0.9}:  keep=16, margin 1.247e-03 above the boundary
#   grid[4] {t=0.7, k=0,  p=0.9}:  keep=8,  margin 1.414e-02 above the boundary
# Every keep count there is comfortably plural; on THIS row the same three
# points keep 2, 2 and 1. Same checkpoint, same five points, different row.
#
# BOTH grid[3] AND grid[4] ARE STILL REQUIRED for chain-order observability, by
# the same two DIFFERENT mechanisms core_qwen3 documented -- only the `top_p`
# values changed. MEASURED HERE: grid[3] {t=1.0, k=50, p=0.993} supplies the
# ENTIRE t->p->k discrepancy (6 cells, top_k and top_p co-active) and none of
# k->p->t; grid[4] {t=0.7, k=0, p=0.985} supplies the ENTIRE k->p->t
# discrepancy (6 cells, temperature and the cumulative cut not commuting) and
# none of t->p->k. Dropping either leaves one alternate direction dead --
# exactly `test_the_sampler_grid_makes_chain_ORDER_observable`'s failure mode,
# which is what this instance's INHERITED grid had. Do not trim this grid, and
# do not "restore" either `top_p` to 0.9.
sampler_grid:
  - {temperature: 1.0, top_k: 0,  top_p: 1.0}
  - {temperature: 1.0, top_k: 0,  top_p: 0.91}
  - {temperature: 0.7, top_k: 50, top_p: 1.0}
  # RE-SWEPT, was 0.9: carries t->p->k (6 cells, keep 11, mass margin 10.9x).
  - {temperature: 1.0, top_k: 50, top_p: 0.993}
  # RE-SWEPT, was 0.9: carries k->p->t (6 cells, keep 2, mass margin 108x).
  - {temperature: 0.7, top_k: 0,  top_p: 0.985}
# HELD FIXED at core_qwen3's, and a CLASS-WIDE constant (5 on every shipped
# instance). core_qwen3 recorded a second bf16 tie on this surface --
# `topn_logprobs` is computed off the SAME prefill row independent of any grid
# point, and its ranks 4 and 5 (tokens 9856 and 32961, fp32 logits 16.437449
# and 16.347187) round to the identical bf16 value 16.375, so both frameworks
# keep the same two tokens but disagree on the order. CONFIRMED UNGRADED TODAY
# (`candidate.py::sampler_probe` casts to float32 before `topn_logprobs`), and
# NOT dodged by moving N here, because any N that still includes both ranks
# leaves the tie and any N that excludes one risks an ambiguous SET boundary
# instead. Carried forward as a known residual, not an oversight.
logprobs_top_n: 5

# HELD FIXED at core_qwen3's. Hard wall-clock budget (seconds) for THE WHOLE
# CANDIDATE SANDBOX -- not, despite the name, for the candidate's generate()
# loop. Exceeding it produces NO reward (conftest's
# `pytest_exception_interact` turns a `CandidateTimeout` into exit 4), and
# raising it is not free: the verifier budget is 1800 s total, so a sandbox
# budget near that lets the sandbox be SIGKILLed instead. 900 leaves ~2x.
#
# THE MARGIN IS THINNER ON A `ragged` INSTANCE. ragged_llama3's documented HIGH
# in-container sample is 510.6 s against core_llama3's 485.4 s, and the worker
# is the dominant term in both. Expect the same ~5% widening here over
# core_qwen3's sample; 900 s remains ~1.8x a measured honest run.
#
# THE WHOLE GRADE IS TIMED, which bounds the sandbox from above and is the
# number `task.toml`'s verifier headroom sentence is divided from. MEASURED
# on one H100, reference as candidate, SIX in-container
# grades, every one reward 1.0 / 37 passed / 0 failed / 0 skipped / 0 errored /
# 10 deselected; each a full oracle grading run for ragged_qwen3.
# Paired with the host's 1-minute load average at that run's START:
#     load 11.2  ->  in-container 312.0 s   end-to-end  317 s
#     load 19.2  ->               295.5 s               301 s
#     load 18.3  ->               295.1 s               300 s
#     load 13.8  ->               297.9 s              ~303 s
#     load 32.9  ->               342.6 s               348 s
#     load 20.0  ->               287.0 s               292 s
#     out-of-container pytest    294.4 / 298.3 / 356.6 s  (host venv, same two
#                                pins; not what any timeout governs)
# THE LOAD DOES NOT ORDER THE DURATIONS, and saying so is the honest read of
# this table. Only the extreme tracks: the load-32.9 run is the slowest by 10%
# and the only one outside 287-312 s. Between load 11 and load 20 the durations
# move over that 25 s window in no order at all -- a 1-minute average is a
# coarse instrument for a 5-minute run on a shared many-core box.
#
# AND THE GPU WAS NOT EXCLUSIVELY OURS during the slow run, which is the confound
# the load average hides: another process was resident on the GPU around the last
# run. The 342.6 s figure is therefore a CONTENDED-GPU reading, not a busy-host
# one.
#
# TOTAL SPREAD 1.19x; ragged_llama3 records 164-511 s (3.1x) and says plainly
# the spread was the box's, which is true here too but worth an order of
# magnitude less. 900 s is 2.6x the slowest measured WHOLE grade, and the
# sandbox this key bounds is a strict subset of that.
#
# `grade_seconds = (287, 343)` is recorded in the generator settings that render
# `task.toml`'s verifier note (~5x headroom over the slow end, ~6x over the
# fast).
#
# `task.toml` is GENERATOR-OWNED and carries the MEASURED verifier headroom
# (1800 s against a measured grade, with the six timings and their host loads);
# hand-editing that generated file makes it DIVERGED, which makes the generator
# refuse the whole run (exit 2). Both files therefore state the same measured
# budget.
generate_timeout_s: 900

# HELD FIXED at core_qwen3's.
compare_hidden_states: true

# THE GRADED DENOMINATOR: how many checks survive collection on this instance.
# Per-instance -- a different mode deselects a different set -- and it does NOT
# follow from anything else in this file, so it is declared rather than
# derived.
#
# MEASURED -- read off an oracle run rather than derived on paper. The point of
# this block is that the value is measured, not predicted. The oracle grading run
# for ragged_qwen3, on one H100 against this instance's own frozen goldens:
#     reward 1.0   n_passed 37   n_failed 0   n_skipped 0   n_error 0
#     spec 14 + numeric 11 + behavioral 12 = 37, perf 0
#     45 checks defined, 8 deselected, 37 collected
# RE-CONFIRMED: same reward, same 37,
# and the deselection list below verified name for name off
# `verifier/eval_summary.json` -- ten names, no `has_ragged` among them.
#
# The four mode-gated checks `conftest._APPLICABLE` keys on `has_ragged`, plus
# the battery axis this mode REQUIRES
# (`golden_manifest.REQUIRED_GOLDENS["ragged"]`), ALL COLLECTED AND PASSED --
# verified by name in the collection roster, not inferred from the total:
#   test_numeric.py::test_ragged_forward_logits         has_ragged
#   test_behavioral.py::test_batching_invariance        has_ragged
#   test_behavioral.py::test_no_cross_sequence_leakage  has_ragged
#   test_numeric.py::test_batch_composition_battery     has_ragged and
#                                                       has_battery_batch_composition
# NO `has_ragged` NAME APPEARS IN `deselected`, which is the condition that
# would mean the mode fact never reached the grader.
#
# THE TEN DESELECTIONS, with the gate each one failed (`deselected_kinds` from
# the same summary). Seven are the set ragged_llama3 records; the other three
# are NOT in that list and each is explained rather than waved at:
#   test_chunked_prefill_logits     mode                 has_chunked
#   test_chunking_invariance        mode                 has_chunked
#   test_prefix_cache_invariance    mode                 has_prefix_cache (= has_chunked)
#   test_chunk_boundary_battery     mode+no_golden_here  has_chunked and battery
#   test_fp32_decode_step_logits    no_producer          golden/fp32_decode_step.npz
#   test_prefill_logits_battery     no_producer          golden/battery/prompt_length/
#   test_paging_battery             no_producer          golden/battery/paging/
#   test_decode_speed               ungraded+no_golden_here
#                                        `perf_graded and has_perf_golden`.
#                                        `golden/perf.json` is frozen and baked
#                                        into the verifier image
#                                        (/tests/golden/perf.json, verified in the
#                                        image), so `has_perf_golden` is True and
#                                        `perf_graded` alone is what deselects
#                                        this check. The reported KIND still reads
#                                        `ungraded+no_golden_here` because
#                                        `conftest._DESELECTION_KIND` is a STATIC
#                                        class-wide string, not a per-instance
#                                        derivation -- do not read this instance's
#                                        reason off it.
#   test_image_preprocess           optional_feature     multimodal
#   test_smart_resize_targets       optional_feature     multimodal
#   test_mrope_positions            optional_feature     multimodal
#   test_image_embedding_merge      optional_feature     multimodal
#   test_vision_tower_units         optional_feature     multimodal
#   test_multimodal_prefill_logits  optional_feature     multimodal
#
# THE LAST SIX ARRIVED WITH THE core_qwen2_5_vl WORK, in two waves, and none of
# them existed at the first grade of this instance, which saw 45 defined / 8
# deselected / 37 collected. All six are gated on `multimodal`, which is false
# for `qwen3`. The DEFINED total moved 45 -> 47 (two checks) and then 47 -> 51
# (four more, at the class re-render); the deselected count moved 8 -> 10 -> 14;
# and the COLLECTED count did not move at any point.
#
# THAT IS THE USEFUL PROPERTY, and it has now been demonstrated twice rather
# than argued once: a denominator declared as "defined minus deselected" would
# have drifted under this instance three times without anything about the
# instance changing, and `graded_checks` is declared as the COLLECTED count
# precisely so it does not. The second wave is the stronger demonstration --
# the re-render moved 1809 lines of the graded suite and the collected count
# and the reward both stayed exactly where they were.
# 51 - 14 = 37. core_qwen3 collects 33 on the same family, so the mode axis is
# worth exactly the four `has_ragged` checks and nothing else -- which is the
# comparison this instance exists to make, now measured on both sides.
#
# READ BY the oracle grading run, which asserts `n_passed == graded_checks` beside
# `reward == 1.0`. NOT mirrored into golden/meta.json (see
# the freezer's not-mirrored key list): it is a fact about
# the tests TREE, not about the frozen arrays.
graded_checks: 37

