  # THIS IS THE SECOND DECISIVENESS NUMBER ON THIS INSTANCE AND IT IS NOT
  # `argmax_margin`. They answer different questions and they are calibrated
  # against different measurements:
  #   argmax_margin 0.1875 -- POSITION level, Numeric tier: may the candidate's
  #                           top-1 differ from the reference's at one position of
