# Per-instance source of truth for tasks/core_qwen2.
# the freezer mirrors every value here into
# golden/meta.json; nothing per-instance is hardcoded in the grader.
#
# THIS INSTANCE IS THE FAMILY-AXIS CONTROL (scale-out spec section 3.1). Every
# key below except `model`, `model_name_or_path`, `prompt_len`,
# `prompt_token_ids` and the two calibrated band blocks is held BYTE-IDENTICAL to
# core_llama3's on purpose: holding the mode column fixed is what makes the
# per-family authoring cost a measurement rather than an anecdote.
mode: core
model: qwen2
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct

# Graded precision profile. Two frameworks running independent kernels never
# agree bit-for-bit in reduced precision, so parity is pinned at two precisions
# with different tolerances.
precision_profile: bf16_native
dtype: bfloat16

# ===========================================================================
# CALIBRATED NUMERIC BANDS.
#
# `precision_profile` above selects a CLASS-WIDE band
# (`compare.thresholds_for_profile`); the two sections below are this INSTANCE's
# measured departures from it. The freezer mirrors both into golden/meta.json and
# `fixtures.Golden` serves them as `native_thresholds` / `fp32_thresholds` (plus
# `native_extras` / `fp32_extras` for the keys that are not `NumericThresholds`
# fields). NOTHING in tests/ hard-codes a tolerance; every value a check applies
# comes from here.
#
# WHAT WAS MEASURED, and what it is not. The floors below are the REFERENCE AS
# CANDIDATE -- `solution/ref_jax_repo` graded against goldens frozen from
# `environment/torch_orig` -- i.e. two implementations of the same algorithm, run
# on the pinned H100 under JAX_DEFAULT_MATMUL_PRECISION=highest. That is a floor
# on CROSS-KERNEL NOISE and NOT an estimate of what a legitimate independent port
# will produce. A ratio here is therefore headroom over a lower bound, not a
# safety factor over a typical case, and a later tightening must argue against
# the floor rather than against the ratio.
#
# FOUR RUNS, FOUR PROCESSES, ONE GPU -- and the spread was ZERO. Every floor
# below is the worst of four independent candidate runs, each a freshly spawned
# process against the same goldens on the same physical H100, under the two pins
# the graded path sets (JAX_DEFAULT_MATMUL_PRECISION=highest and
# --xla_gpu_autotune_level=0). MEASURED on core_qwen2, at a host
# 1-minute load average of 200-300: all 759 derived statistics came back
# BIT-IDENTICAL across all four runs -- not "agreed to the quoted digit",
# identical float64 repr -- and so did the candidate's RAW ARRAYS, checked
# directly between two of the four: the native and fp32 prefill logits, the whole
# KV cache, all 25 hidden states, all 8 decode-step logit rows, and all three
# logprob vectors, 39 arrays at max|d| exactly 0.0.
#
# SO A "1.9e-1 CROSS-PROCESS SPREAD" IS NOT A FACT
# ABOUT THE GRADED PATH, and it was never a fact about this checkpoint. It is
# core_llama3's number and it was taken with XLA's GEMM autotuner ON;
# a cross-process bf16 measurement records that the same probe
# at `--autotune-level 0` collapses to one digest and a spread of 0.0, which is
# the configuration `tests/test.sh` and `conftest` both pin. The autotuner is the
# mechanism, contention is the trigger, and the graded path disables it.
#
# WHAT THAT DOES NOT LICENSE. These four runs shared ONE GPU.
# A same-GPU repeat cannot see a cross-GPU difference -- a different SM count,
# a different clock, a different driver path -- and it cannot see the autotuner,
# because that is switched off. The honest reading is narrow: under the pins the
# grader actually sets, on one pinned SKU, the reference-as-candidate is
# reproducible, so a floor taken from one run is not an under-sample of the noise
# a re-grade on the SAME GPU has to survive. A ratio below ~2x is still thin --
# see `centered_cosine_floor` and `argmax_margin` below, which are the two.
# ===========================================================================

# ===========================================================================
# THE VALUES ON TEN OF TWELVE ROWS ARE STILL core_llama3's. THE FLOORS, RATIOS
# AND BINDING SURFACES ARE NOT -- every one below was MEASURED on
# Qwen/Qwen2.5-0.5B-Instruct, reference-as-candidate through the
# shipped probe, worst of four processes.
#
# READ IT AS: an inherited VALUE with a locally measured JUSTIFICATION. Each row
# now records this checkpoint's own floor, its own ratio, which surface binds it,
# and the smallest real defect it still admits. Where the inherited value clears
# this instance's floor, the row says so and says by how much; where the ratio is
# thin, the row says that instead of rounding it up.
#
# THE WHOLE TABLE IN ONE PLACE, so a reader can see which rows are thin without
# reading twelve blocks. Floor = worst of the four runs; ratio = value/floor on
# the quantity the clause actually compares (a residual for the cosine rows):
#
#   row                              value      floor      ratio  binds on
#   fp32 abs_tol                     1.0e-4     7.72e-06   12.95  reference_units/
#                                                                 lm_head.out0
#   fp32 centered_cosine_floor       5.0e-7 res 1.19e-07    4.19  fp32 prefill,
#                                                                 = 2 float32 quanta
#   fp32 max_kl                      1.0e-4     1.73e-06   57.70  fp32 prefill
#   fp32 logprob_atol                4.0e-4     4.58e-05    8.74  gen step 6
#   fp32 logprob_cumulative_atol     1.7e-3     1.59e-04   10.69  the 8-step sum
#   fp32 held_out_logprob_atol       7.5e-4     5.98e-05   12.53  prompt 18
#   fp32 held_out_seq_atol           4.0e-3     3.30e-04   12.13  prompt 3
#   fp32 argmax_margin (default)     0.0        n/a         n/a   0 flips of 11
#   native abs_tol.hidden_states     16.0       5.60        2.86  hidden_22
#   native cent_cos_floor.hidden_st  2.0e-2 res 6.91e-03    2.89  hidden_22
#   native abs_tol.kv_cache_state    0.5        0.23052     2.17  one cache element
#   native max_kl                    0.1        6.22e-03   16.07  native prefill
#   native centered_cosine_floor     2.0e-3 res 1.19e-03    1.69  native prefill,
#                                                                 TOKEN 0  <- thinnest
#   native abs_tol (default)         0.1        0           inf   rel term rules
#   native argmax_margin             0.1875     0 flips    INERT  0.0 grades the same
#   native decisive_margin           0.125      0 flips    (2x below the mechanism
#                                                          bound of 0.25) <- thinnest
#
# TWO ROWS ARE THIN AND BOTH ARE DISCLOSED IN THEIR OWN BLOCKS: the native
# `centered_cosine_floor` at 1.69x, and `decisive_margin`, which on this
# checkpoint sits BELOW the largest deviation that could flip a generated token
# (0.25) rather than at it as it does on core_llama3. One row is INERT
# (`argmax_margin`) and its block says what it should be on the next re-freeze.
#
# THE TWO THAT ARE THIS INSTANCE'S OWN, and they are the only two:
# `abs_tol.hidden_states` and `centered_cosine_floor.hidden_states`. Both were set
# from Qwen2.5's layer-22 residual collapse and both re-measure here unchanged.
#
# WHY THE OTHER TEN WERE NOT RE-SET, stated because it is a constraint and not a
# judgement. `golden/meta.json` is the file the grader reads; instance.yaml is
# mirrored into it by the freezer, and
# `_harness_checks.check_meta_mirrors_instance_yaml` FAILS THE WHOLE GRADE (exit
# 4, no reward) if the two disagree. So changing a VALUE here without a re-freeze
# does not tighten anything -- it makes the instance ungradable. The measurements
# below are what a re-freeze would be argued from; the one row whose value the
# measurement actually contradicts is called out in its own block
# (`argmax_margin`, which is provably inert here).
# ===========================================================================

# The fp32 exactness tier. Defaults come from `compare.FP32_EXACT_THRESHOLDS`
# (abs 1e-3, rel 1e-3, cosine 0.999999, KL 1e-4, argmax_margin 0.0); only the
# lines below differ.
fp32_thresholds:
  # `check_array`'s absolute term, for every fp32 ARRAY surface: the isolated
  # attention output, the eleven reference-unit outputs, the six sampler grid
  # points and the top-N logprobs. TIGHTENED 10x from the class default.
  #
  # MEASURED ON THIS CHECKPOINT (worst of four processes). The floor
  # is the smallest abs term that admits the worst element at this tier's own
  # rel_tol of 1e-3, i.e. max_i(|d_i| - 1e-3*|ref_i|), which is exactly what
  # `check_array` compares:
  #
  #   reference_units/lm_head/lm_head.out0      7.72e-06   <- BINDS
  #   paged_attention/fp32                      6.96e-07
  #   reference_units/gate_up_proj.out0         2.29e-07
  #   reference_units/down_proj.out0            1.18e-07
  #   reference_units/qkv_proj.out0             8.18e-09
  #   reference_units/o_proj.out0               2.72e-10
  #   the other five unit outputs, all six       0
  #   sampler grid points, topn_logprobs
  #
  #   floor 7.72e-06 -- the binding surface is reference_units/lm_head.out0, the
  #                     SAME surface that binds on core_llama3: an 896-deep fp32
  #                     contraction into 151 936 columns, 1 671 296 elements.
  #   value 1.0e-4   -- ratio 12.95x. (17.5x would reflect
  #                     core_llama3's 5.72e-6 floor; this checkpoint's lm_head is
  #                     1.35x noisier, on a vocabulary 1.18x wider.)
  #
  # THE ATTENTION-OP FIGURE MOVED THE MOST, by 86x: 6.96e-07 here against the
  # 8.07e-09 quoted for llama3, so the second surface sits at 144x rather than
  # at four orders of headroom. Still not
  # binding, but it is now the only other surface within 100x of the value.
  #
  # THE SMALLEST REAL DEFECT THIS ROW STILL ADMITS, stated rather than implied:
  # `check_array` is |d| <= abs_tol + rel_tol*|ref|, so the ABS term only rules
  # where |ref| < 0.1. On lm_head.out0, whose values reach 23.4, the rel term
  # admits 2.34e-2 at the peak -- 3 000x this row's value -- so tightening
  # `abs_tol` further would not tighten the surface that binds it. What bounds
  # the deep end of this tier is `rel_tol`, which is the class default and
  # uncalibrated on both bands; that is a recorded class-wide limit, not
  # something this instance can move.
  abs_tol: 1.0e-4
  # Minimum per-token CENTERED cosine on the fp32 logits. Not a
  # `NumericThresholds` field -- the shared comparator's one cosine gate is on
  # the RAW cosine -- so it is served through `Golden.fp32_extras`.
  #
  # THIS ROW IS NOT CALIBRATED IN RATIOS, AND CANNOT BE. `compare.cosine_similarity`
  # and `_formulas.centered_cosine` both accumulate in float32, where the spacing
  # of representable values next to 1.0 is 2^-24 = 5.9605e-08. Every number either
  # cosine clause can ever report is an integer multiple of that QUANTUM, so a
  # "floor 5.96e-8, ratio 8.4x" reading is a ratio over the instrument's
  # resolution, not over a measurement. The scale that means something is quanta.
  #
  # MEASURED ON THIS CHECKPOINT (four processes, `test_fp32_prefill
  # _logits`' own surface -- the 11 x 151 936 fp32 prefill logit block):
  #
  #   honest port (this reference as candidate)     2 quanta     (1.1921e-07,
  #                                                 IDENTICAL on all four runs --
  #                                                 no spread at all to survive.
  #                                                 Per token: eight of the eleven
  #                                                 rows are EXACTLY 0 quanta and
  #                                                 the other three are 1-2, so
  #                                                 the metric is saturated here
  #                                                 and "2 quanta" means "zero")
  #   VALUE, this line                              8.4 quanta   (5.0e-7)
  #   raw `cosine_floor`, class default             16.8 quanta  (1.0e-6); the
  #                                                 measured RAW residual here is
  #                                                 0.0 -- the raw clause is fully
  #                                                 saturated on this instance
  #
  # SO 8.4 QUANTA IS 4.2x THE HONEST FLOOR ON THIS CHECKPOINT, which is the
  # largest headroom any bf16-facing row in this file has and is unchanged from
  # what the value was chosen for. `1 - centered_cosine` here is 2 quanta, i.e.
  # the instrument's floor and not a measurement of disagreement.
  #
  # THE DEFECT SIDE OF THE ARGUMENT IS INHERITED AND WAS NOT RE-RUN HERE. The
  # 11-quanta bf16-rotary-table port, and the claim that this clause is the ONLY
  # one in the fp32 band that rejects it, are core_llama3 measurements of a
  # mutation that is not part of this instance's control sweep. Read them as
  # the reason the value
  # is 8.4 quanta rather than 16.8, not as a statement about Qwen2.5. What IS
  # measured here is the other side: 8.4 quanta sits 4.2x above this checkpoint's
  # own honest port, so the value is not tight against the reference either way.
  #
  # Do NOT tighten the raw `cosine_floor` to match: it is a class default in
  # `compare.FP32_EXACT_THRESHOLDS` and moving it is a class-wide decision.
  centered_cosine_floor: 0.9999995
  # Per-token absolute bound on the CHOSEN-TOKEN LOGPROB of the free-running
  # generation, fp32 tier. Not a `NumericThresholds` field -- it grades one
  # quantity in one check -- so it is served through `Golden.fp32_extras` and read
  # by `test_behavioral.test_decode_trajectory`. The cumulative clause of the same
  # check has its OWN measured bound, `logprob_cumulative_atol` below -- it is NOT
  # `logprob_atol * num_decode_steps`, which is the derived form that clause replaced
  # because no input could fail it.
  #   floor 4.5776e-05 -- MEASURED ON THIS CHECKPOINT: the cross-port
  #                     fp32 per-token gap, `solution/ref_jax_repo` driven through
  #                     the shipped `_t2j/candidate.py` fp32 generation probe,
  #                     against `fp32_generation.npz`. BIT-IDENTICAL on all four
  #                     processes -- 4.577636719e-05 every time -- so there is no
  #                     cross-process spread on this quantity to budget for. It
  #                     binds at generated step 6; the eight per-token gaps are
  #                     2.99e-05 2.53e-05 2.68e-06 4.47e-06 9.70e-06 1.39e-05
  #                     4.58e-05 3.27e-05, and all eight tokens match the golden.
  #   value 4.0e-04  -- ratio 8.74x. (The "floor 3.84e-05, ratio 10.4x" this line
  #                     carried is core_llama3's; this checkpoint is 1.19x noisier
  #                     on the same probe, so the same value buys 8.74x here.)
  # WHY THIS IS AN FP32 BOUND AND THERE IS NO NATIVE ONE, re-measured here rather
  # than inherited. The SAME probe at the native tier -- `cand.generation()`'s own
  # step_logprobs against `generation.npz` -- gives a per-token gap of 6.531e-02
  # on this checkpoint (per step: 8.5e-03 1.3e-02 5.3e-02 1.5e-03 8.8e-03 1.1e-02
  # 6.5e-02 6.0e-02; cumulative 4.82e-02). That is 1 427x the fp32 leg's 4.578e-05
  # and 163x this row's whole value. A native twin would have to be set near 1e-1
  # and would grade nothing; that 1 427x is the entire reason
  # `fp32_generation.npz` exists.
  # THE SECOND HALF OF THE ARGUMENT IS INHERITED AND COULD NOT BE RE-TAKEN HERE:
  # core_llama3 measured a CORRECT implementation's OWN cross-process spread at
  # bf16 as 4.96e-02, the same size as the cross-port gap, which is the stronger
  # claim -- at native the precision effect is not separable from noise at all.
  # Re-taking it needs a second independent correct port, which this instance
  # does not have.
  #
  # DO NOT SET THIS TO 1e-6. The design carried that figure before any measurement
  # and on THIS checkpoint it is 46x BELOW the floor (4.5776e-05): it would fail
  # the worked reference on the first run. (38x was the llama3 arithmetic.)
  #
  # AND THE FLOOR ONLY MEANS THIS IF THE PROBE'S KV CACHE IS FP32. INHERITED, not
  # re-taken here (measured on core_llama3): the same
  # fp32 model with the bf16 SERVING cache lands 6.765e-03 from the same artifact
  # -- 180x looser -- with every token still agreeing and every check still green.
  # It is a statement about the probe's plumbing rather than about the
  # checkpoint, and the plumbing is shared. `meta['fp32_kv_cache_dtype']` pins
  # it, `_t2j/candidate.py` builds the leg at that dtype, and
  # `test_greedy_sequence_fp32` asserts the dtype the engine actually allocated.
  logprob_atol: 4.0e-04
  # Absolute bound on the CUMULATIVE sequence logprob -- |sum(cand) - sum(gold)|.
  # Read by the same check's second clause.
  #
  # IT HAS ITS OWN MEASURED FLOOR BECAUSE THE DERIVED ONE COULD NOT FAIL. The
  # derived bound would be `logprob_atol * num_decode_steps` (3.2e-03), and
  # that is mathematically unreachable: |sum(d)| <= sum(|d|) <= N*max|d| <= N*tol
  # is exactly the bound, and the per-token clause -- which guarantees every
  # |d| <= tol -- is asserted FIRST. No input passes clause 1 and fails clause 2.
  # The justification "a systematic bias hides under the per-token bound"
  # is provably false: a per-step bias b gives N*b, which exceeds N*tol only once
  # b > tol, i.e. only once clause 1 has already failed.
  #   floor 1.5910e-04 -- MEASURED ON THIS CHECKPOINT, directly and
  #                       on the same four runs as `logprob_atol`: 1.5910249e-04
  #                       every time, bit-identical.
  #                       AND A SAME-SIGN CLAIM DOES NOT HOLD HERE.
  #                       core_llama3 recorded "sum|d| == |sum d| to the digit",
  #                       i.e. no cancellation. On Qwen2.5 the eight differences
  #                       do NOT all carry one sign: sum|d| = 1.64467e-04 against
  #                       |sum d| = 1.59102e-04, so 3.3% of the per-token
  #                       disagreement cancels. The floor is therefore very
  #                       slightly LUCKIER than the worst case, and the honest
  #                       upper bound on a same-sign reference is 1.64e-04 --
  #                       which changes the ratio below by 3%, not by an order.
  #   value 1.7e-03    -- ratio 10.69x (10.34x against the no-cancellation bound).
  # AND IT BINDS, BY 1.9x -- NOT 19x. 3.2e-03 (= logprob_atol * 8 steps, the
  # derived form this clause replaced) / 1.7e-03 = 1.88. A 19x figure would be
  # the FLOOR against the derived BOUND, a floor-to-bound comparison presented
  # as a bound-to-bound one.
  # What the clause really buys, recomputed on this instance's own eight steps: a
  # systematic per-step bias b is caught from b > 1.7e-03/8 = 2.125e-04 while the
  # per-token clause still passes it up to 4.0e-04, so the independently covered
  # window is b in [2.125e-04, 4.0e-04]. Real, falsifiable, and marginal.
  # (num_decode_steps is 8 on both instances, so this window is unchanged; the
  # end-to-end +3.0e-04 mutation that demonstrates it was run on core_llama3 and
  # is not re-taken here -- the arithmetic is the same because N is the same.)
  logprob_cumulative_atol: 1.7e-03
  # Per-token absolute bound on the TEACHER-FORCED chosen-token logprob over the
  # HELD-OUT set (`test_behavioral.test_held_out_logprobs`), fp32
  # tier. Not a `NumericThresholds` field, served through `Golden.fp32_extras`.
  # Same argument as `logprob_atol` above, restated for a different frozen
  # artifact: `golden/held_out.npz`'s 25 prompts rather than the one canonical
  # 11-token scenario.
  #
  # THE GEOMETRY, COUNTED FROM THE ARTIFACT rather than carried over, because the
  # row below and `held_out_seq_atol`'s coverage arithmetic both depend on it and
  # BOTH were quoted with core_llama3's counts:
  #   prompt_lens  {2: 4, 6: 3, 7: 3, 8: 3, 14: 3, 15: 3, 16: 3, 22: 3}
  #                EIGHT distinct lengths, straddling the page boundary (8) from
  #                both sides and the second one (16) likewise -- as claimed.
  #   cont_lens    {1: 8, 4: 5, 6: 3, 8: 8, 12: 1}
  #                FIVE distinct continuation lengths, not four, and the counts
  #                are not {8, 8, 8, 1}.
  #
  #   floor 5.9843e-05 -- MEASURED ON THIS CHECKPOINT:
  #                     `solution/ref_jax_repo` graded against
  #                     `golden/held_out.npz` through the shipped candidate probe,
  #                     four processes on one GPU under the graded pins.
  #                     BIT-IDENTICAL on all four (5.984306335e-05), which is what
  #                     an fp32 quantity should do. It binds on prompt row 18
  #                     (prompt_len 15, cont_len 8).
  #   value 7.5e-04  -- ratio 12.53x. (10.45x would be
  #                     core_llama3's 7.176e-05 floor; Qwen2.5 is 1.20x QUIETER on
  #                     this surface, so the same value buys more here, not less.)
  #
  # THIS MEASUREMENT IS FOUR PROCESSES ON ONE GPU, so a cross-GPU claim is not one
  # this instance can make. See the block above `fp32_thresholds` for exactly what
  # the four same-GPU runs do and do not establish.
  #
  # WHY FP32 AND WHY THERE IS NO NATIVE TWIN: see `logprob_atol` above -- the
  # same argument, over the held-out set instead of the canonical scenario.
  held_out_logprob_atol: 7.5e-04
  # Absolute bound on the held-out set's PER-SEQUENCE summed logprob -- the
  # second clause of the same check. MEASURED DIRECTLY, NEVER DERIVED as
  # `held_out_logprob_atol * cont_len`: that form is exactly what the per-token
  # clause already guarantees (|sum d| <= sum|d| <= N*max|d| <= N*tol, and the
  # per-token clause is asserted FIRST), so no input could ever fail it. Same
  # argument `logprob_cumulative_atol` carries at length above -- read it before
  # touching this one.
  #   floor 3.2990e-04 -- MEASURED ON THIS CHECKPOINT, the same way
  #                     and on the same four runs as `held_out_logprob_atol`
  #                     above: 3.298958472e-04, bit-identical on all four. It
  #                     binds on prompt row 3 (prompt_len 2, cont_len 8) -- a
  #                     DIFFERENT row from the per-token clause's row 18, which is
  #                     the small piece of evidence that the two clauses are not
  #                     two readings of one number.
  #   value 4.0e-03  -- ratio 12.13x, tracking `held_out_logprob_atol`'s 12.53x.
  #                     (10.47x would be core_llama3's 3.8197e-04
  #                     floor.)
  # WHAT IT BINDS, RECOMPUTED against THIS instance's held-out geometry, because
  # core_llama3's counts differ and the conclusion
  # moves with them (`golden/held_out.npz`: 25 rows, continuation lengths
  # {1: 8, 4: 5, 6: 3, 8: 8, 12: 1}). A systematic per-token bias b is
  # independently caught by THIS clause -- i.e. before clause 1 already would
  # have -- only on rows whose continuation is long enough that
  # `seq_tol / cont_len < held_out_logprob_atol`:
  #   cont_len 12 (1 row):  b > 4.0e-03/12 = 3.33e-04  -> window [3.33e-04, 7.5e-04]
  #   cont_len  8 (8 rows): b > 4.0e-03/8  = 5.00e-04  -> window [5.00e-04, 7.5e-04]
  #   cont_len  6 (3 rows): b > 4.0e-03/6  = 6.67e-04  -> window [6.67e-04, 7.5e-04]
  #   cont_len  4 (5 rows): b > 4.0e-03/4  = 1.00e-03  -- ABOVE 7.5e-04: clause 1
  #                     already catches any bias large enough to trip this one
  #   cont_len  1 (8 rows): b > 4.0e-03/1  = 4.00e-03  -- likewise subsumed
  # So this clause adds real, independent coverage on TWELVE rows (cont_len 6, 8
  # and 12 -- not 9) and nothing beyond clause 1 on the
  # other thirteen. The cont_len-6 rows contribute a window only 1.12x wide, so
  # the useful coverage is really the nine rows at cont_len 8 and 12; the shape is
  # the same "real but partial window" `logprob_cumulative_atol` documents above,
  # not a uniform multiplier on N.
  held_out_seq_atol: 4.0e-03
  # NOT overridden, and why. EVERY NUMBER HERE IS THIS CHECKPOINT'S, measured
  # worst of four processes:
  #   abs_tol       above -- floor 7.72e-06, ratio 12.95x, binding on
  #                          reference_units/lm_head.out0. See that block.
  #   max_kl        1e-4  -- floor 1.7329e-06, ratio 57.70x. (66.9x is llama3's
  #                          1.50e-6 floor.) NOT derived from the floor and so not
  #                          moved with it: this clause is a SENSITIVITY knob. It
  #                          is binding by construction -- `check_logits_strict`
  #                          applies no cosine override, and KL is the ONLY clause
  #                          that sees a temperature / logit-scale error, because
  #                          centered cosine and argmax are both invariant to a
  #                          positive rescale.
  #                          WHAT 1e-4 BUYS, MEASURED ON THIS CHECKPOINT'S OWN
