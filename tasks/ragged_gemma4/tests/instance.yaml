# --------------------------------------------------------------------------- #
# Probe configuration. The class-wide grid, held fixed on purpose -- these are
# per-CLASS choices, not per-family ones, and holding them fixed is what makes
# the instances' measured bands comparable. Any point that had to move for this
# checkpoint says so on its own line.
# --------------------------------------------------------------------------- #
#
# ONE POINT MOVED, AND IT IS NOT THE ONE `core_gemma4` MOVED, BECAUSE THE ROW
# IS NOT THE SAME ROW. This is the single value in this file that a reader would
# most reasonably expect the mode axis to leave alone, and it is the one the
# mode axis changes most.
#
# THE SAMPLER ROW IS SEQUENCE 2'S, NOT SEQUENCE 0'S.
# The freezer's `step_prefill_forward` sets `_prefill_last_logits =
# self._np(logits)[-1]` off the GRADED forward, and on a mixed batch row -1 is
# the LAST REQUEST's. So `golden/sampler.npz` -- and every criterion
# `test_sampler_transforms`, `test_the_sampler_grid_makes_chain_ORDER_
# observable`, `test_no_sampler_grid_point_cuts_inside_a_tie` and
# `test_no_two_sampler_grid_points_grade_the_same_thing` apply -- is screened
# against a 33-token decode request's row, not against the 124-token prompt
# `core_gemma4` screened. `ragged_llama3`'s own block still says its grid is
# "byte-identical to core_llama3's, and deliberately so"; it is not (its points
# 3, 5 and 6 all differ from that instance's), and that sentence is reported as
# a class-wide documentation defect rather than copied.
#
# THE INHERITED GRID IS DEAD ON THIS ROW. `core_gemma4`'s six points,
# run through `test_the_sampler_grid_makes_chain_ORDER_observable`'s own
# `_grid_probe` against this instance's frozen row:
#
#     point                   keeps    t->p->k    k->p->t   tie margin
#     {1.0,  0, 1.0}         262144          0          0   (inactive)
#     {0.7, 50, 1.0}             51          0          0   (inactive)
#     {1.0,  0, 0.9}              1          0          0   4.020e-02
#     {0.0,  0, 1.0}         262144          0          0   (inactive)
#     {1.0, 12, 0.95}             2          0          0   9.772e-03
#     {0.7,  0, 0.9}              1          0          0   8.109e-02
#     TOTAL                                  0          0   <- BOTH DEAD
#
# THE CAUSE IS THE OPPOSITE OF THE ONE `core_gemma4` HIT, on the same
# checkpoint, and that is the point worth carrying forward. That instance's row
# is FLAT (top-1 probability 0.2878, top-5 0.9143) so `top_p 0.85` never reached
# the `top_k 50` boundary. THIS row is PEAKED -- top-1 0.939512, top-2 0.059890,
# top-3 0.000250 -- because sequence 2 was chosen for a decisive argmax gap, and
# a decisive gap IS a concentrated distribution. Every top_p from 0.85 to 0.94
# keeps ONE token and every one from 0.95 to 0.999 keeps TWO, so no (top_k,
# top_p) pair at temperature 1.0 can make the two transforms co-active over more
# than one surviving token. `test_the_sampler_grid_makes_chain_ORDER_observable`
# names exactly this trade in its own docstring: "ragged's two extra prompts
# were deliberately re-picked for LARGE argmax margins ... That fix concentrated
# the distribution and silently disabled this one."
#
# TEMPERATURE IS THE WAY OUT, and it is why grid 4 here carries a `temperature`
# no other instance in this class uses. At T > 1 the 262 144-wide tail inflates,
# so the FULL distribution's nucleus is wide while the TOP-K-TRUNCATED one is
# still two tokens -- which makes `k` and `p` genuinely co-active and makes both
# isolating swaps observable at one point.
#
# THE REPLACEMENT WAS CHOSEN AGAINST ALL FOUR CRITERIA AT ONCE, over an
# 11 x 9 x 15 sweep of (temperature, top_k, top_p) run against THIS instance's
# own torch bf16 row -- the row the freezer writes, not the JAX one (a sibling
# arm that screened the JAX row shipped a point landing inside a three-way
# tie):
#
#   1. ORDER-OBSERVABLE ON BOTH PAIRINGS FROM ONE POINT. `{2.0, 20, 0.85}` moves
#      18 mask cells under `t->p->k` and 1 under `k->p->t`. Both are required --
#      the check asserts neither total is zero -- and no other point on this
#      grid contributes to either.
#   2. NOT CUT INSIDE A TIE, and not marginal in cumulative mass. The margin at
#      the cut is 9.264e-02, which is 1853x the 5.0e-05 floor and the LARGEST of
#      any candidate carrying both pairings. The alternatives that keep the
#      class's usual temperature range are all far worse on exactly this axis:
#      the nine points at T <= 1.2 that carry both pairings all sit at
#      `top_p 0.999` with margins from 8.833e-05 to 3.653e-04, i.e. 1.8x to 7.3x
#      the floor. The class has already paid a full re-freeze for a 5.4e-06
#      margin, and 1.8x is within an order of that failure.
#   3. NO bf16 RANK-ADJACENCY COLLISION. Re-run with the row cast through
#      bfloat16 and back, the point is IDENTICAL on every figure: keeps 2, 18
#      cells, 1 cell, margin 9.264e-02. That check is not decorative here --
#      the screen's tie
#      column is measured on the input row and so cannot see a collision CREATED
#      by a `T != 1` division, which is precisely this point.
#   4. NOT A DUPLICATE. Survivor counts across the six points are
#      262144 / 51 / 1 / 262144 / 2 / 1, and the two 262144s are both the
#      provably-identity chain, which is the one duplication
#      `test_no_two_sampler_grid_points_grade_the_same_thing` permits.
#
# WHY T = 2.0 AND NOT THE FAMILIAR <= 1.2: it is a measurement, not a taste.
# 2.0 is the smallest temperature in the sweep at which a point carries both
# pairings with a tie margin above 1e-02; below it the only survivors are the
# `top_p 0.999` cuts in criterion 2.
#
# The other five points are the class-wide grid unchanged, and all five were
# re-checked against the same four criteria on THIS row rather than inherited --
# that re-check is the table above, and it is what showed grid 4 had to move.
sampler_grid:
  - {temperature: 1.0, top_k: 0, top_p: 1.0}
  - {temperature: 0.7, top_k: 50, top_p: 1.0}
  - {temperature: 1.0, top_k: 0, top_p: 0.9}
  - {temperature: 0.0, top_k: 0, top_p: 1.0}
  - {temperature: 2.0, top_k: 20, top_p: 0.85}  # order-observable; see above
  - {temperature: 0.7, top_k: 0, top_p: 0.9}
logprobs_top_n: 5

# One JAX generation leg is a prefill plus eight decode steps over a 4.65 B
# model whose forward carries a 2.35 B-parameter per-layer embedding table.
generate_timeout_s: 3600

compare_hidden_states: true

# The graded denominator, observed from the oracle grading run. 37 = `core`'s 33
# plus the four checks that apply only to a mixed batch
# (`test_ragged_forward_logits`, `test_static_shape_bucketing`,
# `test_batching_invariance`, `test_batch_composition_battery`).
graded_checks: 37

# Authoring-host paths. NOT mirrored into meta.json.
torch_orig: ../environment/torch_orig
jax_repo: ../solution/ref_jax_repo
golden_dir: golden
