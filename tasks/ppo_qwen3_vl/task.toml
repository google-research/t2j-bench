schema_version = "1.3"

# Collected from the agent container after the agent phase and handed to the verifier.
# Must be top-level: harbor's [verifier] has no `artifacts` field.
artifacts = ["/workspace/jax_repo"]

[task]
name = "t2j/ppo-qwen3_vl"
description = "Migrate the PPO/qwen3_vl PyTorch training repo to a native JAX/Flax repo (jax_repo/) that preserves training semantics."
keywords = ["pytorch-to-jax", "ppo", "code-migration"]

[metadata]
task_type = "training"
training_method = "ppo"
model = "qwen3_vl"

# Agent: networked (the agent calls its model API); image built by ./build_harbor_images.sh.
[environment]
docker_image = "t2j-agent:ppo-qwen3_vl"
network_mode = "public"
os = "linux"
cpus = 24
memory_mb = 204800
gpus = 1

[agent]
timeout_sec = 10800.0

# Separate verifier: torch-free, no network; tests/test.sh writes /logs/verifier/reward.json.
[verifier]
environment_mode = "separate"
timeout_sec = 3600.0

[verifier.environment]
docker_image = "t2j-verifier:ppo-qwen3_vl"
network_mode = "no-network"
os = "linux"
cpus = 24
memory_mb = 204800
gpus = 1
