# The L6 held-out prompt set.
#
# AUTHORED, NOT SAMPLED, and that is defensible because this is a PARITY
# measurement on identical inputs and not a quality benchmark:
# representativeness buys nothing, axis coverage buys everything, and only
# authoring gives axis coverage on demand. Nothing here is scored against a
# reference ANSWER -- the held-out freezer teacher-forces the supplied
# continuation through `environment/torch_orig/serve.py` at fp32 and freezes the
# per-token log-probs, and a candidate's JAX `serve.py` is asked for the same
# numbers on the same ids.
#
# TEXT ONLY, ON A MULTIMODAL FAMILY, AND DELIBERATELY. This is the class's first
# instance whose checkpoint has a vision tower, and this file still carries no
# image. That is a CHOICE, and it is the one boundary in the contract that could
# be mistaken for an omission, so it is stated here and again as a declared
# boundary in tests/instance_context.md rather than left to be inferred from an
# absence. The graded probe (tests/instance.yaml's `prompt_token_ids`) DOES
# carry the vision markers, so the tower is on the graded path; `serve.py`
# accepts an image and the end-to-end serving check exercises that leg. L6 does
# not, because an L6 number's entire value is CROSS-FAMILY COMPARABILITY: it is
# the one measurement in this class taken on the same 25 sentences by every
# family, and a set that asked this family a different question would answer a
# different question. Adding images here would spend the comparability to buy
# coverage the graded probe already has.
#
# THE TEXT IS core_llama3's, VERBATIM, for that same reason -- unchanged through
# core_qwen2 and core_qwen3, and unchanged here.
#
# WHAT WAS RE-CHECKED, AND IT WAS RE-CHECKED RATHER THAN INHERITED. Every token
# id below was independently re-derived by running Qwen2.5-VL-3B-Instruct's OWN
# shipped `tokenizer.json` (inside `t2j-model:qwen2_5_vl`, via
# `tokenizers.Tokenizer.from_file`, which is the object `model/loader.py`'s
# `load_tokenizer` builds and `serve.py` itself calls -- not `transformers`'
# `AutoTokenizer`) over every `text`/`cont_text` string in this file, and diffed
# against core_qwen3's and core_qwen2's committed ids. ZERO ROWS DIFFER, on
# either comparison, and every row round-tripped (`tok.decode(prompt_token_ids)
# == text`, likewise for the continuation).
#
# WHY THEY AGREE, measured rather than asserted, by hashing the three shipped
# `tokenizer.json` files against each other in their own images:
#   base vocab       151643 entries, md5 IDENTICAL across Qwen2.5-0.5B-Instruct,
#                    Qwen3-0.6B and Qwen2.5-VL-3B-Instruct.
#   merge list       151387 entries, IDENTICAL across all three -- but only
#                    after normalising the SERIALISATION: Qwen2.5 and Qwen2.5-VL
#                    store each merge as one space-joined string ('Ġ Ġ') and
#                    Qwen3 as a two-element array (['Ġ', 'Ġ']), so the raw file
#                    bytes differ while the rule set does not. A byte-level diff
#                    of these files would report a difference that has no effect
#                    on a single id, which is exactly why the check below is a
#                    re-tokenisation and not a file comparison.
#   pre_tokenizer    md5 IDENTICAL across all three.
#   BOS              `add_bos_token: false`, `bos_token: null` on all three, so
#                    no prompt here carries a leading special id.
#   added tokens     22 on Qwen2.5 and Qwen2.5-VL (highest id 151664, i.e. a
#                    151665-entry surface), 26 on Qwen3 (highest 151668). THIS
#                    IS THE ONE PLACE THE THREE DIFFER, and it cannot reach this
#                    file: the extra entries are the vision and tool markers,
#                    none of which occurs in 25 plain-English sentences.
# The match is the measurement -- it is not assumed from the family name, which
# is the mistake core_qwen2's file predicted and core_qwen3's file disproved.
#
# THE HARD CONSTRAINT IS prompt_len + cont_len <= max_model_len = 32
# (pages_per_seq 4 * page_size 8, from tests/instance.yaml). Unchanged from
# core_qwen2/core_qwen3 because the geometry is unchanged and, per the finding
# above, so is every length. `serve.get_serve_args`,
# `config.RunConfig.__post_init__` and `Engine._grow` all enforce it, so a
# longer entry fails at FREEZE time and not at grade time. The largest sum below
# is 22 + 8 = 30, recomputed for this tokenizer rather than carried over.
#
# AXES UNDER THIS TOKENIZER, at page_size 8. Identical to
# core_qwen2's and core_qwen3's numbers, and independently re-counted:
#   prompt_len  2, 6, 7, 8, 14, 15, 16, 22   at counts 4, 3, 3, 3, 3, 3, 3, 3
#               (core_llama3: 3, 7, 8, 9, 15, 16, 17, 23 -- uniformly one
#               higher, which is exactly its hand-prepended BOS and nothing
#               else; the sentences tokenize to the same lengths in both
#               vocabularies).
#   cont_len    1, 4, 6, 8, 12 at counts 8, 5, 3, 8, 1 (core_llama3: 1, 4, 8, 12
#               at 8, 8, 8, 1). Three rows whose continuation is 4 llama3 tokens
#               are 6 Qwen tokens: this tokenizer splits ' 100' and ' 180' into
#               digit pieces where llama3 has a single ' 100' token. Nothing was
#               adjusted to hide that.
#
# WHAT THE SHIFT (RELATIVE TO core_llama3) COSTS, STATED RATHER THAN GLOSSED.
# core_llama3's prompt lengths were authored as one-before / exactly-on / one-after
# triples around each page boundary (7/8/9 and 15/16/17). Losing the BOS turns those
# into two-before / one-before / exactly-on (6/7/8 and 14/15/16), so NO PROMPT here
# ends one token PAST a boundary. The property is not lost, it MOVES INTO THE
# CONTINUATION, which is teacher-forced into the same cache and is the part
# actually scored: row [10] is prompt_len 8 + cont_len 1, so the single scored
# position is index 8 -- the first slot of page 1 -- and row [19] is
# prompt_len 16 + cont_len 1, scoring index 16, the first slot of page 2. An
# off-by-one in the slot mapping or the block-table gather still shows as a
# difference between the members of a triple; it shows on a scored continuation
# token rather than on a prompt token.
#   entropy     every prompt_len bucket carries at least one strongly-determined
#               continuation (a factual completion, marked `determined` in the
#               per-entry comment) and at least one open-ended one (`open`), so
#               the measurement is not taken entirely on near-deterministic
#               tokens -- where a log-prob difference is small for reasons that
#               have nothing to do with the port -- nor entirely on flat
#               distributions, where it is large for the same reason. The labels
#               are core_llama3's, unchanged: they describe the sentence, not the
#               tokenizer.
#
# IDS, NOT TEXT, on the same rule tests/instance.yaml's `prompt_token_ids`
# follows: THE FREEZER MUST NOT DEPEND ON A TOKENIZER. The `text` and `cont_text`
# fields are comments for human readers and are NOT read by anything -- they were
# encoded, inside `t2j-model:qwen2_5_vl`, with the
# `tokenizers.Tokenizer.from_file(.../tokenizer.json)` object `serve.py` itself
# builds and calls, with no `add_special_tokens` flag to set -- this tokenizer's
# post-processor adds none. Every row was round-tripped at encode time --
# `tok.decode(prompt_token_ids) == text` and likewise for the continuation, for
# all 25 rows -- so the comment fields provably describe the ids beside them.
# Editing one of them changes NOTHING; editing the ids without re-freezing
# invalidates golden/held_out.npz.
#
# HAND-EDITABLE. This file and tests/instance.yaml are hand-maintained;
# the rest of tests/ is generated.
