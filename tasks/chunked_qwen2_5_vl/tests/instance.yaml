  #   abs_tol.hidden_states
  #     THE DECLARED VALUE IS NOT SET FROM THE SHALLOW END, AND ON THIS INSTANCE
  #     IT IS NOT SET FROM THE DEEP END EITHER -- it is set from ONE LAYER,
  #     `hidden_31`, and that is the finding. `_shallow_abs_cap` rescales the
  #     declared band per layer by `MARGIN * declared * running_peak_i /
