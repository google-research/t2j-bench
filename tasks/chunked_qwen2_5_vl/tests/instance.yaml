  #     problem" is only true at the shallow end. At `hidden_31`, the layer that
  #     BINDS, the four image rows need 0.159-0.503 and the binding row is TEXT
  #     row 0 at 11.2 -- 22x the worst image row. A calibration that had looked
  #     only at hidden_0 would have set this band at 6.24 and failed five layers.
  abs_tol.hidden_states: 24.0

