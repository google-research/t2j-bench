  #     TWO POPULATIONS SHARE THIS ONE BAND, AND ON A VL INSTANCE THEY ARE NOT
  #     THE SHALLOW AND DEEP ENDS -- they are the TEXT ROWS AND THE IMAGE ROWS OF
  #     THE SAME TENSOR. Measured per row at `hidden_0`:
  #       the SEVEN TEXT rows     max|d| = 0.0 EXACTLY, |ref| <= 0.1001
  #       the four IMAGE rows     max|d| 0.125-0.1875, |ref| 6.75-10.375
