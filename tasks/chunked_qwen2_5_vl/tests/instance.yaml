#     0.812227 = mid(0.809438, 0.815015]  keeps  5 at T=1.2
#
# ALL SIX ARE SAFE ON THE GRADED ROW at both dtypes: no tie straddles the cut,
# and the smallest fp32 cumsum slack is 2832x. THAT IS THE ROW THE GRADED SUITE
# SCORES, and it is the criterion this grid is chosen against.
#
# TWO ARE FLAGGED UNSAFE ON THE **PARITY** ROW, AND THAT IS A REAL TENSION RATHER
# THAN AN OVERSIGHT -- report it, do not paper over it. The screen also checks
# sequence 0's own row ("The picture shows a bright"), which is what
# the parity checks feed their sampler legs. That row is FLAT (top-1
# 0.164) where the graded row is CONCENTRATED (top-1 0.945), so the two want
# OPPOSITE top_p: the parity row needs an aggressive cut to avoid ties in its
# long flat tail, and the graded row needs >= 0.9451 to keep more than one token
# at all. On `core` they are the same row and no tension exists; a mixed-stage
# batch is the first place they diverge, and no single grid can be optimal for
# both. Points 2 and 5 keep 1495 / 944 tokens on the parity row at fp32 and hit
# a native tie there.
#   MEASURED CONSEQUENCE, which is why this is a tension and not a defect:
#   the parity checks run GREEN on this grid, 28/28, including
#   `test_sampler_transforms_agree_at_the_native_dtype` -- 2 mask disagreements
#   over 6 grid rows, worst surviving-value diff 0.000e+00. The native tier
#   already tolerates mask disagreement for exactly this reason; the fp32 tier
#   has 0.
sampler_grid:
  - {temperature: 1.0, top_k: 0,  top_p: 1.0}
  - {temperature: 0.7, top_k: 50, top_p: 1.0}
  - {temperature: 1.0, top_k: 0,  top_p: 0.957811}
  - {temperature: 0.0, top_k: 0,  top_p: 1.0}
  - {temperature: 1.0, top_k: 50, top_p: 0.972968}
  - {temperature: 1.2, top_k: 0,  top_p: 0.812227}
# A CLASS-WIDE CONSTANT, 5 on every instance. Not a per-instance knob: tuning it
# to dodge a bf16 rank tie in the top-N would trade one instance's problem for a
# class-consistency problem, and core_qwen3 recorded that argument in full.
logprobs_top_n: 5
# RAISED OFF THE CLASS VALUE (900) BY A MEASUREMENT, which is the condition the
# family parent's own note set for moving it: "if a graded run's `generate()`
# ever approaches it, raise it as a measurement rather than pre-emptively". It
# did not approach it -- it EXCEEDED it.
#
# MEASURED with the oracle grading run for chunked_qwen2_5_vl, the GPU
# idle throughout: the candidate sandbox was killed at 901 s against the
# 900 s budget and the session ended UNSCORED (pytest exit 4, no reward.json --
# `_require_*`'s machine verdict, deliberately not a zero).
#
# WHAT THIS BUDGET ACTUALLY BOUNDS, because the name is misleading and the
# grader's own message says so: it is the WHOLE-SANDBOX budget for the ONE
# worker spawn that runs every probe in REQUIRED_PROBES -- both prefills,
# decode, both generations, `serve.py::_build`, held-out scoring over 25
# prompts, BOTH battery axes and every invariance -- not the candidate's
# `generate()` loop alone.
#
# WHY THIS CELL NEEDS MORE THAN EITHER PARENT, and it is the two axes adding
# again rather than anything pathological:
#   * the FAMILY is the largest checkpoint in the class outside gpt_oss (7.52 GB,
#     3.1x core_llama3) and builds a VISION TOWER on top of the decoder, so every
#     model construction in the sandbox pays both. ragged_qwen2_5_vl's whole
#     graded pytest measures 444-478 s.
#   * the MODE adds four graded checks and a SECOND battery axis
#     (`chunk_boundary`, four more variants), measured at +84 s on llama3
#     (chunked_llama3 386.8 s against ragged_qwen2 302.3 s, adjacent pair).
#
# THE HOST WAS NOT QUIET AND SAYING SO IS THE POINT. 1-min load average read
# 268.73 (5-min 241.70, 15-min 174.57) during the timed-out run; the GPU was
# idle (1 MiB, 0%) and the contention is CPU, which is what the sandbox's
# checkpoint conversion and two `serve.py::_build` calls are bound by. The
# grader's own timeout message anticipates exactly this -- "the honest reference
# needs a large fraction of it, so on a loaded host this fires on a CORRECT
# port" -- so 1800 is chosen to survive THAT condition rather than to fit a
# quiet-box measurement that has not been taken.
#
# 1800, NOT 3600: `[verifier] timeout_sec` is 3600 for this task, so the sandbox
# budget stays
# strictly inside the verifier's with 2x to spare -- a sandbox budget at or above
# the verifier's would mean a hung port is caught by the OUTER timer, which
# writes no reward.json at all, instead of by the inner one, which fails only the
# checks that read the sandbox.
generate_timeout_s: 1800

compare_hidden_states: true
