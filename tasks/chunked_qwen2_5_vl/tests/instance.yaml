  #     indices 1-4 and the text rows are 0 and 5-10. (Row 0,
  #     `<|vision_start|>`, is a text row with |ref| 0.10009766, the same
  #     population as row 5, so the count is seven text rows, not six.)
  #     The image rows are ~100x the text rows in magnitude and carry ALL of the
  #     disagreement, so the shallow cap -- 4 * 24.0 * 10.375 / 2240 = 0.4446 at
  #     the declared value -- is 4.44x the text rows' entire dynamic range and
  #     grades nothing on them elementwise.
  #     THAT IS A REAL COVERAGE GAP AND IT IS NOT CLOSEABLE BY CHOOSING A
  #     DIFFERENT NUMBER: any band that admits the image rows is vacuous for the
  #     text rows, because `_shallow_abs_cap` scales along DEPTH and there is no
  #     per-ROW scaling in the comparator. What grades the text rows instead is
  #     the per-row centered cosine (`F.centered_cosine` takes the MINIMUM over
