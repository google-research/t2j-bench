# =========================================================================== #
# THE MIXED BATCH -- the only thing `ragged` adds to the scenario, and the reason
# four graded checks that deselect on `core` apply here.
#
# `request_distribution` is [n_decode, n_prefill, n_mixed] and
# `test_ragged_forward_logits` refuses a scenario with a zero in either of the
# first two slots: "a `ragged` scenario with a zero decode count is a prefill
# scenario wearing the wrong label". Two decode + one prefill gives [2, 1, 0].
#
# A `decode` sequence contributes exactly ONE query token (its last) and a
# `seq_len` equal to its FULL length, so its query attends to KV that this
# forward did not write. That is the whole difference between a decode request
# and a prefill request, and it is why the freeze runs a WARM-UP forward first
# (`inputs.npz`'s `warmup_*` arrays) that prefills every decode sequence's
# prefix. Without it a "decode" request would attend to an empty cache and the
# distinction would be a label rather than a computation.
#
# THESE TOKENS ARE NOT `ragged_llama3`'s, AND INHERITING THEM WOULD HAVE FAILED
# SILENTLY. That instance's discriminating sequence is 9 tokens at `page_size:
# 8`, so its single decode query token is the first token of its SECOND page. At
# this family's `page_size: 32` a 9-token sequence fits one page, the two-page
# property vanishes, the `ragged_block_table_off_by_one_row` mutation stops
# discriminating -- and the instance still freezes, still grades 1.0 and still
# looks right. Every length below is re-derived for page_size 32 and for this
# tokenizer.
#
# THE FIVE PROPERTIES THIS BATCH IS BUILT TO HAVE, each checked rather than
# asserted. Every number below can be re-measured against the shipped tree.
#
#   1. sequences[0] RESTATES the top-level `prompt_token_ids` and `page_ids`.
#      `validate_sequences` hard-refuses otherwise, because the generation,
#      decode-step, sampler, serve and held-out probes are single-sequence on
#      every mode and read the top-level keys directly.
#   2. MIXED STAGES: one `prefill`, two `decode` -> [2, 1, 0].
#   3. PAGES ARE DISJOINT, NON-IDENTITY AND IN RANGE. 12 of the 24 pages are
#      used, no page is shared, and no list is `page_ids[i] == i` anywhere.
#      None of the three lists is contiguous-ascending either: a candidate that
#      read `block_table[0] + i` instead of `block_table[i]` -- the "the
#      allocator hands out consecutive pages" assumption -- would reproduce an
#      ascending list exactly and is caught only by a scrambled one.
#   4. EVERY REQUEST SPANS MORE THAN ONE PAGE, so the block table's later entries
#      are load-bearing: sequences 0 and 1 occupy 5 pages each and sequence 2
#      occupies 2. Sequence 2 is sized so its single decode query token is the
#      FIRST token of its second page (position 32 = 1 * page_size, offset 0) --
#      the exact property `ragged_llama3` bought with its 9-token sequence,
#      restored at page_size 32. A block-table gather that is absent, reversed or
#      off by one reaches a different page for that one token, and it is the only
#      token in the batch whose page index changes under an off-by-one in
#      `position // page_size` (sequence 1's query token sits at offset 1 of its
#      page and sequence 0's at offset 6).
#   5. ONE REQUEST CROSSES THE 128-TOKEN SLIDING WINDOW IN THE DECODE PATH.
#      Sequence 1 is 130 tokens, so its decode query sits at position 129 and the
#      twelve sliding layers clip it to keys [2, 129] -- positions 0 and 1 are
#      dropped. MEASURED ON THIS BATCH, by rerunning each request with every
#      layer's `sliding_window` set to None and diffing the graded row:
#            sequence 0 (n=135, prefill)  window moves the row by 0.2500
#            sequence 1 (n=130, decode)   window moves the row by 0.1875
#            sequence 2 (n= 33, decode)   window moves the row by 0.0000
#      -- so the window is live on two of the three requests and provably inert
#      on the third, which is the contrast that makes the axis graded rather
#      than merely present. A batch of three SHORT requests would read 0.0000
#      three times: it would silently lose the alternating-window property
#      `core_gpt_oss` chose `prompt_len: 135` to get, and would lose it in the
#      DECODE path specifically, which sequence 0's prefill does not cover.
#
# AND ALL THREE ARE TRUNCATED ONTO A STRONGLY DETERMINED CONTINUATION, which is
# not optional and which this class has MEASURED the cost of ignoring.
# `test_batching_invariance` compares the two legs' argmax with NO tie-break
# latitude ("both rows are your own output under a transformation that must not
# change the answer"), and `test_ragged_forward_logits` grades the frozen forward
# at `argmax_margin`. On a row whose top1-top2 gap is at or below one bf16 ULP
# both are coin flips: arbitrary token ids can land a gap of EXACTLY 0.0 on a
# graded row, where a control mutation that changes no value at all appears to
# "catch" the check at reward 0.973 -- a false green.
#
#   MEASURED HERE, on this batch (bf16, this checkpoint, one H100, the graded
#   path's own pins: JAX_DEFAULT_MATMUL_PRECISION=highest and
#   XLA_FLAGS=--xla_gpu_autotune_level=0). Two consecutive runs were BIT-
#   IDENTICAL. Both legs are quoted because `test_batching_invariance` compares
#   them to each other, and "gap" is top1-top2 on the graded row:
#
#     seq  continuation   gap alone   gap in batch   cross-leg max|d|   agree
#      0   ' the'            1.4375        1.4375           0.00000      yes
#      1   ' Neptune'        6.3125        6.3750           0.15625      yes
#      2   ' lithium'        3.1875        3.3750           0.29688      yes
#
#   THE LARGEST CROSS-LEG DEVIATION ON THIS BATCH IS 0.29688, and the three
#   gaps clear it by 4.8x / 21.3x / 10.7x (taking the smaller of each pair).
#   That is this instance's own measurement and it stands on its own.
#
#   THE COMPARISON WITH `ragged_llama3`, against the figure in that instance's
#   file: it records the largest cross-leg deviation this class has measured as
#   0.125, one bf16 ULP (see that instance's `sequences` block and its
#   `decisive_margin` note, both of which say 0.125). Its accepted gaps are
#   0.375 / 4.375 / 4.000 against that 0.125, i.e. 3.0x / 35.0x / 32.0x. On that
#   comparison the binding request HERE (4.8x) has 1.6x more headroom than the
#   binding request there (3.0x).
#
#   Sequence 0's cross-leg deviation is EXACTLY zero, which is what a
#   first-in-batch prefill request should read: it attends only to itself, so
#   the batch cannot reach it.
#
#   THE AUTOTUNER PIN IS NOT DECORATION. Without XLA_FLAGS the same measurement
#   returned gap 1.3750 for sequence 0 where the pinned run returns 1.4375 --
#   a full bf16 ULP of movement from nothing at all, at exactly the resolution
#   this measurement is about. Do not compare an unpinned reading to a pinned
#   one.
#
#   The numbers above are the whole argument for these three prompts over any
#   others.
# =========================================================================== #
