# --------------------------------------------------------------------------- #
# Paged KV geometry. WHERE THE MODE AXIS ACTUALLY MOVES.
#
# `core_gpt_oss` runs `max_num_seqs: 1`, which makes the compiled bucket and the
# occupancy coincide: `seq_lens` has one entry either way, `query_start_loc` has
# two, and `padded_num_reqs` is 1. Three sequences is the smallest batch that is
# genuinely mixed AND has more than one request in one of the two stages, so
# every bucketed field is strictly wider than its occupancy and
# `test_static_shape_bucketing`'s four clauses all discriminate.
#
# The two relations config.py::RunConfig.__post_init__ ENFORCES:
#   pages_per_seq * page_size >= max_model_len   ->  6 * 32 = 192 >= 160
#   num_pages >= max_num_seqs * pages_per_seq    ->  24 >= 3 * 6 = 18
# num_pages therefore rises 8 -> 24 with max_num_seqs; it is not a free choice.
# 24 rather than the bare 18 leaves headroom for the allocator probes, and it
# costs nothing that matters: the KV cache at 24 pages is 0.0352 GB at bf16 /
# 0.0703 GB at fp32 against a 75.14 GB pool.
#
# `page_size`, `pages_per_seq` and `max_model_len` are `core_gpt_oss`'s and are
# held fixed on purpose -- they are the family's geometry, and holding them fixed
# is what makes the two instances comparable along the mode axis. Read that
# instance's block before touching `pages_per_seq`: 6 rather than the minimum 5
# is what separates an engine that sizes its block table at `len(page_ids)` from
# one that sizes it at `pages_per_seq`, and an occupancy-sized engine was
# MEASURED passing all three affected checks at 5.
page_size: 32
num_pages: 24
max_num_seqs: 3
pages_per_seq: 6
max_model_len: 160

# Sequence 0's frozen page assignment, kept at top level because `_slot`,
# `test_block_table_contract` and `validate_geometry` all read the
# single-sequence pin and sequence 0 is what they describe. NON-IDENTITY
# everywhere (`page_ids[i] != i`), and `validate_geometry` refuses anything else:
# over a page where `page_ids[i] == i` the slot equals the position, so a
# candidate that ignored `block_tables` and indexed the cache flat would
# reproduce `kv_cache_state.npz` exactly. Five ids because the run spans
# ceil((135 + 8) / 32) = 5 pages. Unchanged from `core_gpt_oss`.
page_ids: [3, 0, 5, 1, 7]

# The K sweep. FOUR legs -- three fitting points once `fit_step_time`
# drops call 1, the minimum at which it has a degree of freedom to see a bad call
# in. `num_decode_steps` (8) MUST be one of these four: `perf_probe` samples
# `tokens` -- the work gate's subject -- only on that leg, and the gate silently
# gets `None` if the coupling breaks.
#
# Feasibility, sized off the TOP-LEVEL `prompt_len` / `page_size` (`perf_probe`,
# like the `generation_probe` it is modelled on, runs a single-sequence
# `Engine.generate` over sequence 0, not the mixed batch below). The sweep's own
# page assignment is NOT frozen -- it drives the candidate's own allocator
# (USE_FROZEN_ALLOCATION["perf"] = False) -- so the only thing that has to fit is
# the COUNT: ceil((prompt_len 135 + 16) / page_size 32) = 5 <= pages_per_seq (6),
# and 135 + 16 = 151 <= max_model_len (160).
# the harness enforces both, per instance.
perf_k_values: [2, 4, 8, 16]

# NO `perf_graded` AND NO `perf_thresholds`, DELIBERATELY, and this is a choice
# rather than an omission -- both keys are in `INSTANCE_KEYS` and an instance may
# set them. `perf_thresholds.delta` is UNCALIBRATED CLASS-WIDE: no instance in
# this class declares one, and pinning a speed ratio would need a multi-day
# cross-GPU study this instance does not have. Absent reads as `perf_graded:
# false` through `_golden_facts`' `bool(meta.get(...))`, which deselects
# `test_decode_speed` and relieves
# `_harness_checks.check_every_threshold_consumer_has_a_key` of demanding a
# `perf_thresholds` key. Do not add one without the measurement behind it.

# --------------------------------------------------------------------------- #
# THE CANONICAL PROBE -- sequence 0, and the SAME 135 tokens `core_gpt_oss`
# freezes. The generation, decode-step, sampler, serve and held-out probes are
# single-sequence on every mode, so holding this prompt fixed is what makes the
# two instances comparable along the mode axis and nothing else.
#
# WHY 135 AND NOT SOMETHING SHORTER, restated because it is the constraint the
# two ADDED sequences below also have to respect: `sliding_window` is 128 and
# `layer_types` alternates, so twelve of the twenty-four layers window their
# attention. A geometry that never reaches 128 makes every sliding layer behave
# EXACTLY like a full layer, half the model goes untested, and both "window every
# layer" and "window no layer" grade green. At 135 the last seven prefill rows
# are genuinely clipped, and all eight decode steps (positions 135..142) are too.
# --------------------------------------------------------------------------- #
