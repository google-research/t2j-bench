#
# Per-instance source of truth for tasks/ragged_gpt_oss.
# the freezer mirrors every value here into
# golden/meta.json; nothing per-instance is hardcoded in the grader. Every key is
# checked against the freezer's known instance keys, so a typo is a
# refusal rather than a silently-defaulted value.
#
# THE MODE AXIS OVER THE gpt_oss FAMILY. Same checkpoint, same family code and
# the same graded suite as `core_gpt_oss`; the axis that moves is `mode`. This is
# the second `ragged` cell of the (mode x family) grid -- `ragged_llama3` is the
# first -- and it is the one that shows what a mixed batch costs a model whose
# attention is windowed on every other layer and whose MLP is a top-4-of-32
# router.
mode: ragged
model: gpt_oss
model_name_or_path: openai/gpt-oss-20b

# gpt-oss-20b routes 4 of 32 experts per token and 19.1B of its 20.9B parameters
# live in them. `conftest._golden_facts` reads this off meta.
is_moe: true

# --------------------------------------------------------------------------- #
# Precision. The serving tier, as for every instance in this class.
# --------------------------------------------------------------------------- #
precision_profile: bf16_native
dtype: bfloat16

# =========================================================================== #
# THE BANDS, MEASURED ON THIS INSTANCE'S OWN GOLDENS. Every value below carries
# its floor, its ratio and the surface that binds it. Nothing here is inherited:
# the values copied in from core_gpt_oss were UNMEASURED, and one of the five
# copied values was
# WRONG -- `abs_tol.kv_cache_state: 4.0` FAILED the worked reference on this mode
# (band utilisation 1.573), which is what a band copied across a mode change buys.
#
# THE METHOD, and it is the one `core_gpt_oss` established. Each side is compared
# to a float32 run OF ITS OWN FRAMEWORK, not to the other side. That is the honest
# question -- "how far is bf16 from the definition?" -- rather than the convenient
# one, and it matters because on two of the four rows below the reference, not the
# port, is the looser side. Demanding tighter than that is demanding more agreement
# than the reference has with itself. Three legs per surface, everywhere:
#
#   T   torch-bf16 vs torch-fp32   the reference's own bf16 error
#   J   jax-bf16   vs jax-fp32     the port's own bf16 error
#   C   torch-bf16 vs jax-bf16     what the grade actually compares
#
# and the band is set above max(T, J, C) -- the INTRINSIC bf16 envelope -- with a
# stated headroom. All four legs were produced by the freezer's and the candidate
# driver's own frozen-prefill compositions, so they are the graded computation and
# not a model of it: the torch legs reproduce `prefill_forward.npz` and
# `fp32_prefill_forward.npz` BIT FOR BIT, and the jax bf16 leg reproduces the
# grade's own reported `max|d| = 10.0` against `kv_cache_state.npz`.
#
# RUN-TO-RUN SPREAD IS EXACTLY ZERO ON THIS INSTANCE, which is worth recording
# because `core_gpt_oss` had to widen `centered_cosine_floor` by ~1.6x for order
# statistics that were "not run-stable". Three full graded runs on one
# H100 host (717 s, 651 s, 703 s docker-elapsed; load average START -> END
# 12.09 -> 20.54, 18.75 -> 12.02 and 15.02 -> 7.94, the GPU itself 1 MiB -> 1 MiB
# on every one) returned BIT-IDENTICAL values for every quantity below -- every
# centred cosine, every needed abs_tol, every logprob gap, spread 0.00e+00. So
# "worst of three" and "the value" coincide here, and the headroom below is
# carried for CROSS-IMPLEMENTATION variation (the T/J/C spread) rather than for
# run noise. `XLA_FLAGS=--xla_gpu_autotune_level=0` is what buys that; do not
# compare an unpinned reading to these.
#
# LOAD AVERAGE IS A PAIR PER RUN, NOT A SCALAR. The full start -> end pairs are
# above. Do not re-collapse them to one figure per run -- the direction matters
# here, because run 2 and run 3 both got QUIETER while running and run 1 got
# busier, which is why the wall clocks disagree while every graded value does
# not.
#
# THE FAMILY EFFECT THAT MAKES THE NATIVE TIER WIDE IS THE CHECKPOINT'S, NOT THE
# MODE'S, and it does follow here: 136 of `core_gpt_oss`'s 3240 (layer, token)
# pairs select a different set of experts between the two references, every one at
# a 4th-vs-5th router-logit gap at or below one bfloat16 ULP. A flipped token runs
# a genuinely different expert -- a percent-level change, not a last-bit one.
# =========================================================================== #

# --------------------------------------------------------------------------- #
# THE FP32 TIER. NO T AND J COLUMN HERE, and that is not an omission: on this
# tier both sides ARE fp32, so there is one definition and nothing to be far from.
# The only measurable leg is C. (The two frameworks' fp32 runs agree to centred
# cosine 0.999999762 on this batch, which is what makes the tier meaningful at
# all.) Read `tests/instance_context.md` for why "fp32" is a weaker claim on a
# 4-bit checkpoint than on the dense families: what it grades is fp32
# ACCUMULATION over exactly-dequantised MXFP4 weights.
#
# WHY THIS TIER IS NOT A REDUNDANT STRICTER COPY OF THE NATIVE ONE ON THIS FAMILY.
# `core_gpt_oss` measured all three sliding-window mutations as caught by the FP32
# TIER ONLY -- `sliding_window_on_every_layer` 0.8788, `sliding_window_parity_
# inverted` 0.8788, `sliding_window_on_no_layer` 0.9091, at native-tier catch
# counts of 1, 1 and ZERO. The window changes only the last 7 of 135 prefill rows,
# and that effect sits INSIDE the native band the MoE's expert flips forced open.
# For the sliding window the fp32 tier is the only tier that grades it at all, so
# it must not be widened toward the native one and must not be deselected.
#
#   key                       floor (C)      declared    ratio   binding surface
#   abs_tol                   1.0985e-05     1.0e-04      9.1x   reference_units/
#                                                                rotary_emb.out0
#   centered_cosine_floor     0.999999762    0.9999995   2.10x   fp32_prefill_
#                                                                logits, row 20
#   logprob_atol              6.1750e-05     4.0e-04     6.48x   test_decode_
#                                                                trajectory step 1
#   logprob_cumulative_atol   4.6110e-04     1.7e-03     3.69x   the 8-step sum
#   held_out_logprob_atol     7.3910e-05     7.5e-04    10.15x   test_held_out_
#                                                                logprobs, per token
#   held_out_seq_atol         6.6447e-04     4.0e-03     6.02x   held-out prompt 24
#
# Every value is UNCHANGED from what was copied in, and every one is now MEASURED
# rather than assumed.
# `centered_cosine_floor` at 2.10x is the tightest thing on this instance and the
# one to watch: it is a single-row order statistic (row 20 of 137), and it is
# stable only because this instance's run-to-run spread is zero. `abs_tol`'s floor
# is set by the ROTARY unit, not by the logits, which is the useful diagnostic
# here -- 1.0985e-05 at |ref| up to 16.8.
fp32_thresholds:
  abs_tol: 1.0e-4
  centered_cosine_floor: 0.9999995
  logprob_atol: 4.0e-04
  logprob_cumulative_atol: 1.7e-03
  held_out_logprob_atol: 7.5e-04
  held_out_seq_atol: 4.0e-03

# --------------------------------------------------------------------------- #
# THE NATIVE (bf16 serving) TIER.
#
#   key                        T          J          C        floor   declared  ratio
#   argmax_margin              --         --      0.125       0.125    0.1875    1.5x
#   decisive_margin            --         --      0.0625      0.0625   0.125     2.0x
#   centered_cosine_floor      0.995558   0.990245 0.990347   0.989629 0.983    1.64x
#   centered_cosine_floor
#     .hidden_states           0.985805   0.969532 0.969563   0.969532 0.95     1.64x
#   abs_tol.kv_cache_state     5.1587     7.0821   6.6203     7.0821   9.0      1.27x
#   abs_tol.hidden_states    521.3142   514.1171 278.4000   521.3142  600.0     1.15x
#
# ON TWO OF THE FOUR ROWS THE REFERENCE IS THE LOOSER SIDE, exactly as on
# `core_gpt_oss`, and on a THIRD the port is: `abs_tol.hidden_states` is set by
# TORCH's own bf16 error (521.31) at 1.87x the cross-framework disagreement
# (278.40), while `abs_tol.kv_cache_state` is set by JAX's (7.08) at 1.07x the
# cross leg (6.62). A tier that demanded either side agree with the other more
# closely than it agrees with its own fp32 run would be demanding the impossible.
native_thresholds:
  # THE ARGMAX MARGIN. Positions whose GOLDEN top1-top2 gap exceeds this are
  # "decisive" and argmax parity is required there; near-ties are excluded so a
  # genuine bf16 tie-flip cannot fail a correct port.
  #
  # FLOOR 0.125, AND IT MOVED. `core_gpt_oss`'s three argmax disagreements all sit
  # at a gap of 0.0625, so its 0.1875 carried 3x. On THIS batch the prefill's five
  # disagreements are also at 0.0625 -- but the BATCH-COMPOSITION BATTERY reaches
  # 0.125 on both variants, and the battery is a `ragged`-only surface that
  # `core_gpt_oss` does not have. So the floor is 0.125 and 0.1875 carries 1.5x,
  # one bf16 grid step, not three. Re-measured rather than confirmed, and this is
  # the row where that mattered.
  #
  # WHAT THE MARGIN COSTS, so the headroom is not free-looking. Over the 137
  # prefill rows: 132 decisive at margin 0, 120 at 0.0625, 115 at 0.125, 110 at
  # 0.1875, 104 at 0.25. So 0.1875 excludes 22 of the 132 and every one of the 5
  # genuine disagreements. NOT widened to 0.25: that would deselect six more
  # graded positions to buy headroom nothing measured asks for.
  argmax_margin: 0.1875
  # SEQUENCE-LEVEL decisiveness for `test_greedy_sequence`. NO FLOOR IS MEASURABLE
  # FOR THIS KEY ON A CORRECT PORT -- the reference's native and fp32 tokens both
  # match the golden exactly on all three runs, so the excusing branch never
  # executes. Same situation `ragged_llama3` records.
  #
  # WHAT IS MEASURABLE is the largest cross-port |d| at a TOP-2 position of a
  # generation-aligned row: 0.0625, one bf16 ULP. 0.125 is 2.0x that, so a
  # divergence this key excuses is provably inside the resolution the two ports
  # share. (`ragged_llama3` reaches the same value at 1.0x of its own 0.125.)
  #
  # AND THE UNCOMFORTABLE HALF, recorded because a ratio alone would hide it. The
  # generation-aligned golden margins here are
  #     [1.375, 0.0625, 1.375, 0.5625, 0.1875, 1.25, 0.0625, 1.3125]
  # so the SMALLEST is 0.0625 -- HALF the declared margin, where `ragged_llama3`'s
  # smallest is 0.5 and clears it by 4x. Steps 1 and 6 therefore sit at a genuine
  # one-ULP tie and a divergence at either is EXCUSED by design; the other six
  # convict. That is the right answer for a one-ULP gap and it is not a defect,
  # but it means this check grades 6 of 8 steps on this instance, not 8 of 8.
  # Lowering the key to grade them would convict a correct port on a coin flip.
  decisive_margin: 0.125
  # THE LOGIT CENTRED COSINE, and it is TIGHTENED 0.95 -> 0.983 by the split below.
  #
  # This tier value now grades the LOGIT surface alone, because
  # `centered_cosine_floor.hidden_states` takes the residual stream. The two
  # surfaces are two orders apart in what they need -- envelope 0.989629 against
  # 0.969532 -- and one number for both meant grading the logits, which is the
  # sensitive clause, at the band the post-final-norm layer forced. 0.983 is 3.0x
  # tighter than the 0.95 that was copied in.
  #
  # FLOOR 0.989629, and it is NOT the canonical prefill: the binding surface is
  # `batch_composition_battery[d1p2]` (row 128), a `ragged`-only variant, against
  # the prefill's 0.990347 and `ragged_forward_logits/request_0`'s 0.990347. The
  # intrinsic envelope on the canonical surface is J = 0.990245 -- the PORT's own
  # bf16 error, marginally looser than the cross leg -- so the floor is set by the
  # battery reading and the canonical envelope agrees with it to 6e-04.
  #
  # HEADROOM 1.64x OF THE MEASURED (1 - cosine), which is one rule applied to both
  # cosine keys rather than two fitted numbers: 1 - 0.983 = 0.017 against a
  # measured 0.010371. `core_gpt_oss` carries ~1.6x on this key for run-stability;
  # this instance's runs are bit-identical, so the same allowance is carried for
  # the T/J/C spread instead, which is the variation a band across PORTS has to
  # survive.
  centered_cosine_floor: 0.983
  # THE RESIDUAL STREAM'S OWN FLOOR -- THE KEY THIS INSTANCE WAS MISSING.
  #
  # It was absent, and an absent per-surface key is invisible: `_centered_floor`
  # falls back to the tier value with nothing said, so the hidden clause silently
  # set the logit clause's band. A key-set diff across all eight instances named
  # exactly this one gap (`core_qwen2` is the only other declarer), and this closes
  # it. The mechanism is `core_qwen2`'s and the reason is this family's: the stream
  # runs 75.5 -> 41728 -> 225 across the 25 layers and the FINAL NORM collapses it
  # 57x, so hidden_24 reads 0.969563 while every other layer is >= 0.984785.
  #
  # FLOOR 0.969532, from J (jax-bf16 vs jax-fp32) at hidden_24 -- the PORT's own
  # bf16 error, 3e-05 tighter than the cross leg's 0.969563, so this band is the
  # intrinsic envelope and not the observed disagreement. Torch's own leg is far
  # looser at 0.985805 (its worst is hidden_15, a different layer). 0.95 is 1.64x
  # of the measured (1 - cosine), the same rule as the tier key above.
  #
  # The value coincides with `core_gpt_oss`'s tier floor. That is a coincidence of
  # the checkpoint, not an inheritance: it is re-derived here from this batch's own
  # hidden_24, and what has actually changed is that it no longer drags the logits
  # down with it.
  centered_cosine_floor.hidden_states: 0.95
  # THE ONE VALUE THAT WAS WRONG WHEN COPIED, and the reason this task exists.
  #
  # At the inherited 4.0 `test_kv_cache_write` FAILS the worked reference, on all
  # three runs, at band utilisation 1.573.
  #
  # THE CAUSE IS THE WARM-UP KV, AND IT IS NOT SCALE. This block previously said
  # the cause was scale -- "this cache peaks at 159.0 where `ragged_llama3`'s
  # peaks at 17.125, 9.3x smaller" -- and that is FALSE in both halves, so it is
  # replaced rather than softened:
  #
  #   * `ragged_llama3` never supplied the 4.0. THE PARENT IS `core_gpt_oss`,
  #     which declares `abs_tol.kv_cache_state: 4.0` and whose cache peaks at
  #     157.0 -- 1.3% BELOW this instance's 159.0, not 9.3x below. The scale
  #     hypothesis is refuted by the very instance the value came from.
  #   * `abs_tol` DOES NOT TRACK PEAK IN THIS CLASS, so no rescale-by-peak rule
  #     should be derived from this row. Measured across the seven instances with
  #     frozen caches: core_llama3 / chunked_llama3 / ragged_llama3 all carry 0.5
  #     at peak 17.125; core_qwen2 carries THE SAME 0.5 at peak 218.0; core_qwen3
  #     carries 2.0 at peak 420.0; core_gpt_oss carries 4.0 at peak 157.0. That
  #     last pair is decisive on its own -- core_gpt_oss has a LOWER peak than
  #     core_qwen2 and an EIGHT TIMES larger band.
  #
  # WHAT ACTUALLY MOVED IT is a surface `core_gpt_oss` does not have. This mode
  # runs a WARM-UP forward before the graded one, and the two write DISJOINT sets
  # of cache slots -- measured, the intersection is EMPTY:
  #     graded `slot_mapping`          137 slots  (seq 0's 135 prefill rows,
  #                                                plus one decode row each from
  #                                                seq 1 and seq 2)
  #     `warmup_slot_mapping`          161 slots  (seq 1's 129-token prefix and
  #                                                seq 2's 32-token prefix)
  #     overlap                          0 slots
  # ALL THREE LEGS BIND IN WARM-UP-ONLY SLOTS. Unravelling the flat indices
  # recorded below against `golden/inputs.npz` and the frozen `page_ids`:
  #     T  flat 10550772 -> layer 13, page  9, pos 31, K, head 7  slot 319
  #     J  flat 17584083 -> layer 22, page  8, pos 19, V, head 7  slot 275
  #     C  flat 12967828 -> layer 16, page 11, pos 23, V, head 6  slot 375
  # -- warm-up-only every one, and all three on SEQUENCE 1, the 130-token
  # window-crossing decode request whose prefix occupies pages 8..12.
  #
  # AND THE SPLIT SETTLES IT. Re-running the same three legs restricted to each
  # slot set:
  #                                 T        J        C     envelope
  #     GRADED slots (137)      3.0865   2.8054   3.0560     3.0865
  #     seq 2 warm-up (32)      2.6336   3.8532   4.4242     4.4242
  #     seq 1 warm-up (129)     5.1587   7.0821   6.6203     7.0821
  # ON THE SURFACE `core_gpt_oss` ACTUALLY HAS, 4.0 WOULD HAVE HELD -- 3.0865
  # needs it and that is BELOW core_gpt_oss's own 3.4318, i.e. this instance is
  # TIGHTER than its parent there. The entire breach comes from the 161 warm-up
  # slots, at 2.29x the graded surface. The `UNMEASURED -- INHERITED` banner this
  # block replaced predicted exactly that when it said "this mode runs a WARM-UP
  # forward first"; the measurement now says it did.
  #
  # WHAT THAT SPLIT COSTS, AND WHY IT IS ACCEPTED HERE RATHER THAN FIXED.
  # `test_kv_cache_write` compares the WHOLE array under ONE band, so the tighter
  # population is graded at the looser population's tolerance: the 137 graded
  # slots need 3.0865 and are checked at 9.0 -- 2.92x of slack they never use --
  # purely because the 161 warm-up slots share the array. That is the argument
  # `_surface_band`'s own docstring makes one level up, about a TIER spanning
  # 0.51 / 17.1 / 414.0, recurring WITHIN a single surface.
  #
  # It is not fixed here for two reasons, and the second is the substantive one.
  # (a) Scope: every `ragged` and `chunked` instance has the same split -- a
  # text-only `core` instance has no warm-up slots at all, which is why it
  # surfaces on this axis -- so a per-population band is a class-wide change and
  # a re-freeze of every affected instance. (b) IT IS NOT OBVIOUSLY RIGHT.
  # Splitting the band, or excluding the warm-up slots to tighten the graded
  # ones, would drop real coverage: warm-up page management is genuine engine
  # state a port can get wrong -- a decode request whose prefix is written to the
  # wrong pages is a live defect class, and these slots are the only place it is
  # visible as a VALUE error rather than only through the occupancy clause. So
  # the choice is a design call about what the check should grade, not a
  # calibration one, and it is tracked as a class-wide item rather than decided
  # unilaterally by the instance that happened to measure it first.
  #
  # THE THREE LEGS, and the criterion was fixed before they were computed. If
  # max(T, J) had come in BELOW C, the cross-framework excess would not have been
  # bf16 noise, this would be a reported PORT DEFECT and the band would not have
  # moved at all. It did not:
  #     T  torch-bf16 vs torch-fp32   5.1587   binding |ref| 3.734  |d| 5.532
  #     J  jax-bf16   vs jax-fp32     7.0821   binding |ref| 0.367  |d| 7.119
  #     C  torch-bf16 vs jax-bf16     6.6203   binding |ref| 5.750  |d| 7.195
  # max(T, J) = 7.0821 >= C = 6.6203, so the port agrees with the reference MORE
  # closely than the port agrees with its own fp32 run. Envelope 7.0821, set by J.
  #
  # WHERE THE BINDING ELEMENT IS, because it is not where it looks. The band is
  # |d| <= abs_tol + rel_tol*|ref|, so the element that binds `abs_tol` is the one
  # maximising |d| - 0.1*|ref|, NOT the one maximising |d|. On leg C that is flat
  # index 12967828 at |ref| 5.750, |d| 7.195 -- while max|d| over the whole array
  # is 10.0, at an element whose larger |ref| lets the relative term absorb it.
  # The same element binds the utilisation, which is why 6.6203/4.0 = 1.655 and the
  # measured utilisation 1.5727 differ: the denominators differ by the rel term.
  #
  # HEADROOM 1.92 bf16 ULP AT THE CACHE PEAK, DERIVED AND NOT FITTED, which is the
  # whole lesson of the value it replaces. bf16 ULP at 159.0 is exactly 1.0, so the
  # ladder here is integral. 1.92 is the MEASURED SPREAD BETWEEN THE THREE LEGS
  # (7.0821 - 5.1587 = 1.9234) -- this instance's own reading of how far two
  # correct implementations of the same forward disagree about what this surface
  # requires. 7.0821 + 1.9234 = 9.0055, and 9.0 is the largest integral-ULP rung at
  # or below it. `core_gpt_oss` took 4.0 over a worst leg of 3.4318, i.e. 1.166x,
  # and that thin margin is precisely what a mode change breached; 9.0 is 1.271x
  # the envelope and 1.359x the cross leg.
  #
  # IT COSTS NO COVERAGE, AND THAT WAS MEASURED RATHER THAN ASSUMED. Band
  # utilisation (>1.0 = CAUGHT), at 4.0 and at 9.0, ON TWO METERS -- the meter is
  # named per row because they disagree by an order of magnitude on two of the
  # five and a table that mixed them silently would be unreadable:
  #     CANDIDATE-based = golden vs a MUTATED CANDIDATE ("a port that also did X")
  #     GOLDEN-based    = golden vs a MUTATED GOLDEN    (the mutation alone)
  #
  #                                            CANDIDATE        GOLDEN
  #                                          @4.0    @9.0    @4.0    @9.0
  #     the correct port (jax bf16)         1.573   0.752      --      --
  #     k and v written SWAPPED            38.832  17.560  38.832  17.560
  #     slot mapping shifted one page      39.250  17.444  39.250  17.444
  #     one kv head zeroed (L0, head 0)     6.476   4.495   6.476   4.495
  #     uniform 1% rescale                  1.579   0.753   0.080   0.064
  #
  # The three gross mutations read IDENTICALLY on both meters -- each dominates
  # the bf16 disagreement completely -- so the widening's cost is unambiguous:
  # every one is caught at 9.0 by 4.5x to 17.6x. (The correct-port row has no
  # golden-based reading by construction: golden against golden is zero.) The
  # occupancy clause is exact, untouched by any of this, and sees the paging bugs
  # independently.
  #
  # ONE HONEST LIMIT, PRE-EXISTING AND NOT CAUSED BY THE WIDENING, and it is the
  # row where the two meters diverge. A uniform 1% rescale reads 0.080 / 0.064 on
  # its own -- far inside any band -- and candidate-based it reads 1.579 / 0.753,
  # i.e. indistinguishable from the correct port's 1.573 / 0.752 at either value.
  # So the value clause cannot see a pure scale error at ANY band that admits the
  # reference, and could not at 4.0 either. It is caught downstream, by the logit
  # parity the same cache feeds.
  abs_tol.kv_cache_state: 9.0
  # THE RESIDUAL STREAM'S ABSOLUTE BAND. UNCHANGED at 600.0, and now measured.
  #     T  torch-bf16 vs torch-fp32   521.3142  @ hidden_22
  #     J  jax-bf16   vs jax-fp32     514.1171  @ hidden_22
  #     C  torch-bf16 vs jax-bf16     278.4000  @ hidden_23
  # Envelope 521.3142, set by TORCH -- the reference is the looser side here, by
  # 1.87x over the cross leg, which is the same shape `core_gpt_oss` measured
  # (542.15 / 534.15 / 278.40). 600.0 is 1.151x the envelope and 2.155x the cross
  # leg, and the grade's measured utilisation on the binding layer is 0.721.
  #
  # WHY IT IS NOT RE-ROUNDED ONTO THE ULP LADDER the way the cache band is. bf16
  # ULP at this surface's peak (41728) is 256, coarser than the entire margin: the
  # rungs are 512 (below the envelope) and 768. 768 would loosen every SHALLOW cap
  # by 1.28x -- `_shallow_abs_cap` rescales this value by running_peak/global_peak
  # -- and the shallow end is where this band is tight. So the ladder rule that
  # fixes `abs_tol.kv_cache_state` is ill-conditioned here and is not applied;
  # 600.0 is kept on its measured ratio instead.
  #
  # THE SHALLOW END, which the declared value governs through `_shallow_abs_cap`
  # and which is the real lower bound on it: the binding layer is hidden_6, needing
  # 4.0680 against a cap of 4.0*600*220/41728 = 12.653, i.e. 3.11x. Expressed as
  # `_HIDDEN_STATE_CAP_MARGIN`'s own unit that is 1.286 -- a NEW WORST FOR THE
  # CLASS, above `core_gpt_oss`'s 1.222, so the 4.0 constant now carries 3.11x
  # rather than 3.3x. Still comfortable, but it is the number to re-read if a
