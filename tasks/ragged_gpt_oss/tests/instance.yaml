# =========================================================================== #
# The sampler grid. THE STRUCTURE IS `core_gpt_oss`'s -- same six points, same
# temperatures, same top_k values, same two co-activations -- AND THE THREE
# top_p VALUES ARE THIS INSTANCE'S OWN, because they cannot be inherited.
#
# WHY NOT, and this is the part a "the sampler is a per-token transform chain,
# so the mode axis cannot move it" argument misses. The chain is indeed
# per-token. But `step_prefill_forward` freezes `sampler.npz` from `logits[-1]`
# of the GRADED forward, and on a ragged batch row -1 is the LAST request's
# single decode row, not sequence 0's last prefill row. So the ROW moves with
# the mode even though the transform does not, and a top_p value is a statement
# about where a cumulative cut lands ON A PARTICULAR ROW. `ragged_llama3` has the
# same property and its file does not say so: its sampler row is argmax 5679 at
# gap 4.0 where `core_llama3`'s is argmax 10057 at gap 0.375, yet its grid is
# byte-identical to core's. That grid happens to survive its row; this one's
# does not survive mine, MEASURED -- `core_gpt_oss`'s grid 2 at top_p 0.905 cuts
# between two logits that are both exactly 12.375 on sequence 2's row, an exact
# tie, which is precisely the defect that value was chosen to avoid on ITS row.
#
# SCREENED AGAINST ALL FOUR CRITERIA, on the measured row (JAX reference, bf16,
# autotuner pinned), not assumed:
#
#   grid 2  {1.0, 0, 0.812}   keeps 3   cut margin 1.046e-02 = 209.2x the 5e-05
#                             floor; boundary logits 13.9375 / 13.75, distinct
#                             at bf16 by 3 ULP.
#                             CORRECTED ON THE FROZEN ROW: it keeps 4, not 3,
#                             at margin 9.792e-03 = 195.8x, boundary 13.8125 /
#                             13.75 (1 ULP). Same "screened on the JAX row,
#                             frozen from the torch row" slip as grid 4's, but
#                             here it costs only the count in this comment --
#                             the point is clean on the graded row either way.
#   grid 4  {1.0, 50, 0.900}  keeps 7   margin 7.173e-03 = 143.5x; boundary
#                             13.4375 / 12.5, 15 ULP apart. THE POINT THAT
#                             MAKES `top_p BEFORE top_k` OBSERVABLE: 5 cells
#                             move under that reordering (grid 2 cannot -- with
#                             top_k 0 the two orders are the same function).
#
#     0.900 IS A REPAIR OF 0.914, AND THE ORIGINAL VALUE WAS MEASURABLY WRONG.
#     The screen quoted above was run on the JAX reference's row; the row that
#     actually got frozen is TORCH's, which this file's own stress-test
#     paragraph below names as the hazard. On the frozen row, ranks 7, 8 and 9
#     are ALL exactly logit 12.5 and 0.914's cumulative cut lands between ranks
#     8 and 9 -- INSIDE the tie -- at a margin of 3.874e-06, which is 12.9x
#     BELOW the 5e-05 floor. Consequences, all measured rather than predicted:
#       * `test_sampler_transforms` FAILED the worked reference, three runs out
#         of three, `golden_kept 9` with 2 positions disagreeing. No tolerance
#         could have fixed it -- the surviving-token SET is compared exactly, by
#         design, because which tied member survives is `argsort`'s tie-break.
#       * two of the three sampler-grid guard tests FAILED on this instance and on
#         no other of the eight: `test_no_sampler_grid_point_cuts_inside_a_tie`
#         and `test_no_top_p_boundary_collides_at_bf16`. (The third,
#         `test_the_sampler_grid_makes_chain_ORDER_observable`, passed.)
#     This is the same defect `core_gpt_oss` moved 0.9 -> 0.905 to avoid, one
#     instance later, for the same reason.
#
#     WHY 0.900 AND NOT THE OTHER CLEAN CANDIDATES. Screened on BOTH rows at
#     BOTH precisions with the sampler-grid screen, whose `--verify-against`
#     proved the instrument BEFORE it chose: against this instance's own parity
#     artifact the recomputed parity row is BIT-IDENTICAL to the gate's
#     `sampler_input` and the per-point survivor counts MATCH the gate.
#       THE GATE HAS BEEN RUN AT 0.900, so the committed grid is certified by the
#       grade itself and not only by inference from the screen. The parity checks
#       pass 23 passed / 0 failed, exit 0. The survivor vectors are
#       fp32 [201088, 50, 60, 201088, 19, 9] and native
#       [201088, 50, 58, 201088, 19, 10], matching the screen's own recomputation
#       for 0.900 exactly, with 0 fp32 mask disagreements. The 4 native mask
#       disagreements on that run are grid 2's already-known native tie (worst
#       surviving value diff 0.000e+00), not grid 4's.
#     On that verified instrument:
#         0.895   graded fp32 keeps 7 but NATIVE keeps 6 -- the two precisions
#                 disagree on the survivor count, which is what this grid point
#                 must not do on a bf16-native tier
#         0.900   graded 7/7, parity 19/19, both precisions agree on both rows;
#                 graded-row slack 17190.7, the largest of the candidates
#         0.905   graded 7/7, parity 20/20; slack 7284.1, 2.4x less margin for
#                 the same boundary pair
#         0.9285  graded fp32 11 / native 10 -- precisions disagree, AND it
#                 changes what the point covers (7 -> 11 survivors)
#         0.930   graded 11/10 and parity 25/24 -- disagrees on both rows
#     0.900 is the only candidate that is clean on all four criteria, agrees
#     across precisions on both rows, and KEEPS 7 -- so this repairs the point
#     rather than replacing it, and the coverage prose above stays true.
#     Both chain reorderings stay live with it (5 cells k-vs-p, 34 t-vs-p).
#   grid 5  {0.7, 0, 0.95}    keeps 1   margin 1.201e-02 = 240.2x; boundary
#                             25.0 / 20.125, 39 ULP apart. THE POINT THAT MAKES
#                             `temperature AFTER top_p` OBSERVABLE: 29 cells
#                             move, and it is the only one that can -- a point
#                             at temperature 1.0 is invariant under moving a
#                             no-op division, and grid 1's top_p is 1.0.
#
#   Totals over the grid, MEASURED on the frozen row at 0.900:
#   5 cells move under t->p->k and 34 under k->p->t, so
#   `test_the_sampler_grid_makes_chain_ORDER_observable` has a live signal on
#   both alternatives. No point cuts inside an exact tie ON THE GRADED ROW, every
#   graded-row cut clears the cumulative-mass floor by >= 143x, and no graded-row
#   boundary pair collides at bf16.
#
#   THE STRESS TEST WAS RIGHT ABOUT THE HAZARD AND WRONG ABOUT THE MARGIN. It
#   said: "the row screened here is the JAX reference's and the row that will
#   actually be frozen is torch's ... perturbing every one of the 201088 logits
#   by an independent random +-1 bf16 ULP fails 2 of 60 trials". The hazard it
#   named is exactly what happened -- grid 4 failed on the real torch row -- so
#   a 2-in-60 synthetic perturbation was NOT a conservative proxy for a real
#   change of row. Do not screen on a row the freezer will not use; the guards
#   below and the tool named above both read `golden/sampler.npz`, which is the
#   frozen row, and that is the only row worth screening on.
#
#   THE THREE GUARDS HAVE BEEN RUN (they skip while `golden/sampler.npz` is
#   absent):
#     pytest -k "sampler_grid_makes_chain or cuts_inside_a_tie or bf16" -q
#
#   ONE KNOWN, UNREPAIRED FINDING, recorded rather than fixed here because it is
#   not this grid's graded surface and moving it would change what grid 2 covers.
#   The sampler-grid screen screens BOTH rows at BOTH precisions, and on the
#   PARITY row -- the standalone single-sequence prefill that the parity checks
#   transform, NOT the graded row -- grid 2's 0.812 cuts inside a bf16 tie at
#   logit 8.625 (native) and its fp32 slack is 27.7 against the screen's
#   SLACK_FLOOR of 50. On the GRADED row 0.812 is clean and wide:
#   4 survivors, no tie at either precision, slack 41069.6. So `test_sampler_
#   transforms` is unaffected and the parity gate has already passed
#   23/23 at this value; the exposure is a latent tie-break in the AUTHORING
#   gate, not in the grade. Swept for a replacement: 0.78 and 0.79 are the only
#   clean values in [0.78, 0.86] and both drop the graded row from 4 survivors to
#   3, so the repair is not free. Left as-is, deliberately and with the number
#   written down.
# =========================================================================== #
sampler_grid:
  - {temperature: 1.0, top_k: 0, top_p: 1.0}
  - {temperature: 0.7, top_k: 50, top_p: 1.0}
  - {temperature: 1.0, top_k: 0, top_p: 0.812}   # top_p alone; keeps 4 (frozen row)
  # NOT a duplicate of grid 0 on the MASK -- `apply_temperature` passes through at
  # both 1.0 and 0.0, so the two mask identically (both keep all 201088) and, since
  # the surviving values are also unchanged, on the VALUE clause too. What grid 3
  # uniquely covers is the DIVISION: a port that writes `logits / temperature`
  # without special-casing 0.0 emits inf/nan here and nowhere else in the grid.
  # THIS IS A MEASUREMENT AND NOT JUST AN ARGUMENT. A
  # `temperature_divides_at_zero` mutation was swept on THIS instance:
  #     reward 0.9730 = 1 - 1/37, caught by test_sampler_transforms and by
  #     nothing else, 36 passed / 1 failed / 0 errored of 37 graded.
  # The convicting assertion is grid 3 ALONE and it is the MASK clause, not the
  # value clause: `{'grid_point': '3', 'params': {'temperature': 0.0, 'top_k': 0,
  # 'top_p': 1.0}, 'non_neginf_masked_positions': 19347}`, `assert 19347 == 0`.
  # (19 347 is THIS instance's count on THIS frozen row -- the same patch
  # simulated on core_llama3's row gives 25 124. The mechanism transfers, the
  # number does not; do not quote another instance's.) Mechanism, as predicted:
  # negative logits divided by +0.0 give -inf and positive ones +inf, so the
  # mutant's mask set is nothing like the reference's all-201088-kept.
  # SO GRID 3 EARNS ITS PLACE ON EVIDENCE. It remains bit-identical to grid 0 on
  # both graded clauses -- that has not changed and is not a defect -- and its
  # unique contribution is exactly the one argued for above: it is the only point
  # in the grid that can see a port writing `logits / temperature` without the
  # zero guard. The two reorder mutants still fire [0,0,0,0,5,0] and
  # [0,0,0,0,0,34] on the frozen row, i.e. neither of THEM touches grid 3, which
  # is why this needed its own control rather than being covered incidentally.
  - {temperature: 0.0, top_k: 0, top_p: 1.0}
  - {temperature: 1.0, top_k: 50, top_p: 0.900}  # top-k AND top-p co-active; keeps 7
  - {temperature: 0.7, top_k: 0, top_p: 0.95}    # temperature AND top-p co-active
logprobs_top_n: 5

# Hard wall-clock budget (seconds) for THE WHOLE CANDIDATE SANDBOX -- not,
# despite the name, for the candidate's generate() loop. It bounds the single
# worker spawn that runs every probe in `REQUIRED_PROBES`: both prefills, decode,
# both generations, serve.py::_build, held-out scoring, the batteries and the
# invariances.
#
# 3600, which is `core_gpt_oss`'s value and not the class's 900/1800, and this
# instance needs it at least as much as that one does. The family's forward is
# dominated by dequantising 19.1e9 expert values on every call; `core_gpt_oss`
# measured 525.36 s of in-container graded pytest on an idle host and raised this
# to 3600 to match `[verifier] timeout_sec`, the largest it can usefully be since
# the container's own hard kill fires no later than that regardless. This mode
# adds a warm-up forward, two battery variants and three invariance probes on top
# of that, so the honest run here is strictly longer.
generate_timeout_s: 3600

compare_hidden_states: true

# THE GRADED DENOMINATOR: how many checks survive collection on this instance.
# Per-instance -- a different mode deselects a different set -- and it does NOT
# follow from anything else in this file, so it is declared rather than derived.
#
# 37, against `core_gpt_oss`'s 33. The four are exactly the mode-gated checks
# `conftest._APPLICABLE` opens on `has_ragged`, plus the battery axis this mode
# REQUIRES (`golden_manifest.REQUIRED_GOLDENS["ragged"]`):
#   test_ragged_forward_logits      has_ragged
#   test_batching_invariance        has_ragged
#   test_no_cross_sequence_leakage  has_ragged
#   test_batch_composition_battery  has_ragged and has_battery_batch_composition
# The same +4 `ragged_llama3` carries over `core_llama3` (37 vs 33), and the
# counts were re-derived from the instances on disk rather than inherited:
# core_llama3 33, core_qwen2 33, core_qwen3 33, core_gpt_oss 33, ragged_llama3 37,
# chunked_llama3 41.
#
# READ BY the oracle grading run, which asserts `n_passed == graded_checks` beside
# `reward == 1.0`, and by `conftest._instance_graded_check_count` in-container,
# which floors the collected count against it.
graded_checks: 37

# Authoring-host paths. NOT mirrored into meta.json.
torch_orig: ../environment/torch_orig
jax_repo: ../solution/ref_jax_repo
golden_dir: golden
