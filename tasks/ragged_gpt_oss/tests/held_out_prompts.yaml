# The L6 held-out prompt set for core/gpt_oss.
#
# AUTHORED, NOT SAMPLED, and that is defensible because this is a PARITY
# measurement on identical inputs and not a quality benchmark: representativeness
# buys nothing, axis coverage buys everything, and only authoring gives axis
# coverage on demand. Nothing here is scored against a reference ANSWER --
# the freezer teacher-forces the supplied continuation through
# `environment/torch_orig/serve.py` at fp32 and freezes the per-token log-probs,
# and a candidate's JAX `serve.py` is asked for the same numbers on the same ids.
#
# THE HARD CONSTRAINT IS prompt_len + cont_len <= max_model_len = 160
# (pages_per_seq 5 * page_size 32, from tests/instance.yaml).
# `serve.get_serve_args`, `config.RunConfig.__post_init__` and `Engine._grow` all
# enforce it, so a longer entry fails at FREEZE time and not at grade time. The
# largest sum below is 77 (page-boundary 65).
#
# AXES, at page_size 32:
#   prompt_len  2, 6, 7, 20, 21, 22, 23, 31, 32, 33, 34, 35, 39, 43, 63, 64, 65
#               -- the one-before / exactly-on / one-after triples at BOTH page
#               boundaries the run can reach (31/32/33 and 63/64/65), plus a
#               spread of short lengths below the first boundary. An off-by-one
#               in the slot mapping or in the block-table gather shows as a
#               difference BETWEEN the members of a triple, not as a uniformly
#               wrong number that a single length could not localise.
#   cont_len    1, 2, 4, 5, 8, 9, 12. 1 is the degenerate single-token case; 12 at
#               prompt_len 65 carries the whole scored window across a boundary
#               the prompt did not reach.
#   entropy     every prompt_len bucket carries at least one strongly-determined
#               continuation (marked `determined` in the per-entry comment) and
#               at least one open-ended one (`open`), so the measurement is not
#               taken entirely on near-deterministic tokens -- where a log-prob
#               difference is small for reasons that have nothing to do with the
#               port -- nor entirely on flat distributions, where it is large for
#               the same reason.
#
# DELIBERATELY SHORTER THAN THE INSTANCE PROMPT, and it is worth being explicit
# because instance.yaml goes to great lengths to exceed `sliding_window`. That is
# the right choice THERE and the wrong one here: L6 measures the log-prob band
# over many independent prompts, the sliding window is already exercised by every
# other tier on the 135-token probe, and 25 prompts at 135 tokens would multiply
# the freeze -- which runs on CPU against a 20.9B model -- by an order of
# magnitude for coverage the suite already has.
#
# IDS, NOT TEXT, on the same rule tests/instance.yaml's `prompt_token_ids`
# follows: THE FREEZER MUST NOT DEPEND ON A TOKENIZER. The `text` and `cont_text`
# fields are comments for human readers and are NOT read by anything -- they were
# encoded once, with
# `Tokenizer.from_file("/data/openai/gpt-oss-20b/tokenizer.json")` and
# `add_special_tokens=False`, and with NO bos prepended (gpt-oss's special tokens
# are the harmony chat frame; these are bare completions, exactly like
# instance.yaml's prompt). Editing one of them changes NOTHING; editing the ids
# without re-freezing invalidates golden/held_out.npz.
#
# The six `page-boundary N` entries are SLICES of one long passage's id list
# rather than authored sentences -- which is how their lengths are exact. Their
# `text` is what the tokenizer decodes those ids back to.

