  - text: 'Rivers have shaped human settlement for as long as there have been settlements at all, and the reason is not romantic but practical: a river is drinking water, a road, a boundary and a source of power, and for most of history a town that had one could do things a town that did not could never do. The first cities of Mesopotamia grew where the Tigris and the Euphrates could be diverted into fields; the first cities of Egypt grew along a single river whose flood was so regular that the calendar was built around it. In Europe the pattern repeats at a smaller scale. London sits at the lowest point where the Thames could be bridged and still be reached by seagoing ships, which is a very specific compromise and explains the shape of the city better than any plan does. Paris began on an island in the Seine because an island is defensible and a ford is valuable, and the two halves of the modern city are still called the left bank and the right bank after the water between them. Vienna, Budapest and Bratislava are all Danube towns, and Belgrade sits where the Sava joins it; the river carried grain downstream and salt upstream for centuries before any of them had a railway. Further east the pattern is the same but the distances are larger, and a single river can be the only reliable way to move anything at all for months of the year. What changes with industry is not that rivers stop mattering but that what they are for changes. A mill needs a fall of water; a factory needs cooling; a port needs depth, and depth is dredged rather than found. Embankments appear, then locks, then reservoirs upstream that hold the flood back so the city below can build on ground that used to be a floodplain. Each of these makes the river more useful and less like a river, and the eventual result is a waterway that is managed end to end and that nobody thinks of as wild. The costs of that arrive later and are mostly paid by people downstream, which is why river law is old, complicated and full of compromises between places that cannot see one another. A treaty about a river is a treaty about rainfall in somebody else''s mountains, and the further apart the two ends are the harder the bargain becomes. Modern water management inherits all of it: the old weirs, the old rights, the old assumption that the flow next year will look like the flow last year. That last assumption is the one that has begun to fail, and it is failing first in the basins where the margin was always thinnest and the number of parties to the bargain was'
    cont_text: ' always largest, which is to'
