# The L6 held-out prompt set for core/gemma4.
#
# AUTHORED, NOT SAMPLED, and that is defensible because this is a PARITY
# measurement on identical inputs and not a quality benchmark: representativeness
# buys nothing, axis coverage buys everything, and only authoring gives axis
# coverage on demand. Nothing here is scored against a reference ANSWER --
# the freezer teacher-forces the supplied continuation through
# `environment/torch_orig/serve.py` at fp32 and freezes the per-token log-probs,
# and a candidate's JAX `serve.py` is asked for the same numbers on the same ids.
#
# THE HARD CONSTRAINT IS prompt_len + cont_len <= max_model_len = 544
# (pages_per_seq 17 * page_size 32, from tests/instance.yaml).
# `serve.get_serve_args`, `config.RunConfig.__post_init__` and `Engine._grow` all
# enforce it, so a longer entry fails at FREEZE time and not at grade time.
#
# ===========================================================================
# THE LAST ENTRY IS THE ONLY PLACE IN THIS INSTANCE'S GRADE WHERE THE SLIDING
# WINDOW ACTUALLY CLIPS, AND IT IS HERE ON PURPOSE.
# ===========================================================================
# gemma-4-E2B's `sliding_window` is 512 and 28 of its 35 layers use it. The main
# probe is 124 tokens, so on the canonical scenario every sliding layer sees its
# whole sequence and behaves EXACTLY like a full-attention layer -- which means a
# port that passed `sliding_window=None` everywhere would grade green on all of
# it. `core_gpt_oss` closed the same hole by raising its main prompt over its own
# 128-token window; at a 512-token window that costs 545 MB of frozen logits and
# a golden tree near 1.6 GB, against `core_gpt_oss`'s measured 424 MB.
#
# This path is where it is cheap. L6 freezes per-token LOG-PROBS, not logits, so
# the 520 + 6 entry below costs about 2 KB of `held_out.npz` and puts 512
# genuinely-clipped query positions through all 28 sliding layers. It is the
# reason `max_model_len` is 544 rather than the ~160 the main probe needs, and
# tests/instance.yaml says so at the geometry block.
#
# NO CONTINUATION TOKEN MAY SCORE A LOG-PROB OF 0.0, and that is a hard
# refusal in the freezer's build step rather than a preference: the rows are
# zero-PADDED to the longest continuation, so a real 0.0 inside a row is
# indistinguishable from padding downstream. A saturating continuation can
# hit exactly 0.0 -- for example two digits of " 100 degrees Celsius". Every
# continuation here is scored on the fp32 reference and the
# worst single token across all sixteen rows is -8.900e-04; the five that
# saturated were replaced rather than trimmed, because a shorter version of
# a saturating continuation is still measuring nothing on the tokens it
# keeps.
#
# IT IS ONE LONG ENTRY AND NOT SEVERAL, deliberately: the freezer teacher-forces
# every entry through the fp32 TORCH reference on CPU, and a 528-token forward
# over a 4.65 B model is by far the most expensive thing in this file.
#
# AXES, at page_size 32:
#   prompt_len  3, 7, 8, 31, 32, 33, 63, 64, 65, 92, 520
#               -- the one-before / exactly-on / one-after triples at BOTH page
#               boundaries the short entries reach (31/32/33 and 63/64/65), a
#               spread below the first boundary, and the window-crossing entry.
#               An off-by-one in the slot mapping or in the block-table gather
#               shows as a difference BETWEEN the members of a triple, not as a
#               uniformly wrong number that a single length could not localise.
#   cont_len    1, 2, 6, 7, 8, 9, 10, 12. 1 is the degenerate single-token
#               case; 12 at prompt_len 92 carries the whole scored window
#               ACROSS a page boundary the prompt did not reach (92 spans
#               three pages, 104 spans four).
#   entropy     every short bucket carries at least one strongly-determined
#               continuation (marked `determined`) and at least one open-ended
#               one (`open`), so the measurement is not taken entirely on
#               near-deterministic tokens -- where a log-prob difference is small
#               for reasons that have nothing to do with the port -- nor entirely
#               on flat distributions, where it is large for the same reason.
#
# EVERY PROMPT STARTS WITH `<bos>` (id 2), unlike `core_gpt_oss`'s bare
# completions. gemma-4's tokenizer.json has an EMPTY `special_tokens` table in
# its TemplateProcessing post-processor, so `encode` never adds one, while
# `generation_config.json` declares `bos_token_id: 2`. tests/instance.yaml's
# `prompt_token_ids` carries the same leading 2 for the same reason.
#
# IDS, NOT TEXT, on the same rule tests/instance.yaml's `prompt_token_ids`
# follows: THE FREEZER MUST NOT DEPEND ON A TOKENIZER. The `text` and `cont_text`
# fields are comments for human readers and are NOT read by anything -- they were
# encoded once, with
# `Tokenizer.from_file("/data/google/gemma-4-E2B-it/tokenizer.json")` and
# `add_special_tokens=False`. Editing one of them changes NOTHING; editing the
# ids without re-freezing invalidates golden/held_out.npz.
#
# The `page-boundary N` and `sliding window` entries are SLICES of one long
# passage's id list rather than authored sentences -- which is how their lengths
# are exact. Their `text` is what the tokenizer decodes those ids back to.

