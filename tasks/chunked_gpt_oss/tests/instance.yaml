# =========================================================================== #
# THE CHUNKED AXIS. Split at 17, and this is the ONE geometry number neither
# parent supplies -- `chunked_llama3` splits at 5 on a page_size of 8, and
# neither gpt_oss instance chunks at all. Four independent reasons, in the order
# they bind:
#
#   1. 0 < 17 < page_size (32), so the chunk-boundary battery
#      sets its `interior` variant to THE INSTANCE'S OWN SPLIT rather than to the
#      derived `page_size // 2`. MEASURED at this exact geometry
#      (page_size 32, prompt 135, own_split 17), the four boundary variants are:
#           {'aligned': [32], 'interior': [17], 'far_interior': [33],
#            'tail': [134]}     -- four variants, none dropped
#      `interior` is 17, NOT 16. At S = 16 the two coincide and the frozen battery
#      could not distinguish a freezer that honours `own_split` from one that
#      ignores it. At S >= 32 the canonical split is covered by no battery variant
#      at all, and at S == 32 or S == 33 the variant is silently DROPPED for
#      clashing with `aligned` / `far_interior`.
#   2. 17 is OFF a page boundary, so the canonical scenario itself exercises a
#      partial-page write: chunk 1 fills slots 0..16 of physical page 3 and chunk
#      2 resumes at slot 17. A page-aligned split would leave the hardest case to
#      the battery alone.
#   3. 17 is inside (7, 128), which is where a chunk-relative-positions defect is
#      maximally observable. `attention/paged.py` computes
#      `q_pos[t] = seq_lens[s] - q_len[s] + (t - query_start_loc[s])`, i.e. the
#      ABSOLUTE position; a port that built chunk 2's positions as
#      `arange(0, q_len)` instead of `arange(17, 135)` would clip NO row at all
#      (chunk-relative row i clips only at i >= 128, absolute q >= 145 > 134)
#      where seven absolute rows (128..134) must clip.
#   4. 17 != 5 converts a class-wide INERT control into a live one.
#      `mutations.chunked_llama3/chunk_split_point_hardcoded.patch` replaces
#      `cached = self._lens[request_id]` with the literal `cached = 5`, and
#      the freezer rules it inert TASK-KEYED on `chunked_llama3`'s
#      own `chunk_split_points == [5]` -- the hardcoded value and the honest one
#      coincide there. Here the mutant computes `seq_len = 5 + 118 = 123 != 135`,
#      with a wrong `slot_mapping` and a wrong `q_pos`, which
#      `test_chunked_prefill_logits` grades directly. PREDICTED HERE; the measured
#      status is recorded in the report, not asserted in this comment.
#   5. 17 < shared_prefix_len (32), mirroring `chunked_llama3`'s own 5 < 8: the
#      shared page's slots 0..16 are written by the WARM-UP forward and slots
#      17..31 by the GRADED forward that r1 also reads them in. That intra-call
#      write-then-read ordering is the mode parent's proven shape.
chunk_split_points: [17]

