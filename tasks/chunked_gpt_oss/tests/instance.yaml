# THE SIX POINTS ON THE GRADED ROW (survivors / cut margin as the tool's `slack`
# / boundary pair), fp32 and native agreeing on the survivor count everywhere:
#   0 {1.0,  0, 1.0  }  keeps 201088   no cut          identity mask
#   1 {0.7, 50, 1.0  }  keeps      51  ulp 1.00        10.1875 / 10.125
#   2 {1.0,  0, 0.812}  keeps       4  slack 41069.6   13.8125 / 13.75
#   3 {0.0,  0, 1.0  }  keeps 201088   no cut          the division-by-zero point
#   4 {1.0, 50, 0.900}  keeps       7  slack 17190.7   13.4375 / 12.5
#   5 {0.7,  0, 0.95 }  keeps       1  slack 77034.8   17.375  / 14.0625
# No point cuts inside an exact tie ON THE GRADED ROW at either precision, and
# no graded-row boundary pair collides at bf16. ORDER OBSERVABILITY over the
# whole set, graded row, fp32: 5 cells move under k-vs-p and 34 under t-vs-p ->
# OBSERVABLE on both alternatives, so
# `test_the_sampler_grid_makes_chain_ORDER_observable` has a live signal.
