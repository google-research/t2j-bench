# WHY 135 AND NOT SOMETHING SHORTER: `sliding_window` is 128 and `layer_types`
# alternates, so twelve of the twenty-four layers window their attention. A
# geometry that never reaches 128 makes every sliding layer behave EXACTLY like a
# full layer, half the model goes untested, and both "window every layer" and
