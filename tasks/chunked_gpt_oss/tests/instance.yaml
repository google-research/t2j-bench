# --------------------------------------------------------------------------- #
# Paged KV geometry. THE FAMILY'S GEOMETRY WITH THE MODE'S BATCH ON TOP.
#
# The two relations config.py::RunConfig.__post_init__ ENFORCES, and they are the
# only two it enforces (core_gpt_oss/solution/ref_jax_repo/config.py:137-156):
#   pages_per_seq * page_size >= max_model_len   ->  6 * 32 = 192 >= 160
#   num_pages >= max_num_seqs * pages_per_seq    ->  24 >= 3 * 6 = 18
# Everything else is validate_geometry / validate_sequences, which were run for
# real against this file (see the `sequences` block below for the resolved
# output).
#
# `page_size`, `pages_per_seq` and `max_model_len` are `core_gpt_oss`'s and are
# held fixed on purpose -- they are the FAMILY's geometry, and holding them fixed
# is what makes the three gpt_oss instances comparable along the mode axis and
# nothing else. Read `core_gpt_oss`'s block before touching `pages_per_seq`: 6
# rather than the minimum 5 is what separates an engine that sizes its block
# table at `len(page_ids)` from one that sizes it at `pages_per_seq`, and an
# occupancy-sized engine was MEASURED passing all three affected checks at 5.
#
# `max_num_seqs: 3` is the MODE's (via `ragged`): the smallest batch that is
# genuinely mixed AND has more than one request in one stage, so every bucketed
# field is strictly wider than its occupancy and `test_static_shape_bucketing`'s
# four clauses all discriminate.
#
# `num_pages: 24` IS INHERITED FROM `ragged_gpt_oss` WITHOUT A DERIVATION, and
# this file says so rather than dressing it up. `RunConfig` forces only >= 18.
# That instance's own comment says the extra six pages are "headroom for the
# allocator probes" and gives the cost (0.0352 GB at bf16 against a 75.14 GB
# pool) but derives nothing; `core_gpt_oss` separately measured that genuine page
# disjointness needs `num_pages >= 10` at `max_num_seqs: 1`, and the equivalent
# figure at three sequences was not derived there and is not derived here. What
# IS checked here: this instance's three requests own {3,0,5,1,7}, {9} and
# {14,13} -- 8 of the 24 -- so 24 is comfortably sufficient and the question is
# only whether it is minimal, which nobody has answered.
page_size: 32
num_pages: 24
max_num_seqs: 3
pages_per_seq: 6
max_model_len: 160

# Sequence 0's frozen page assignment, kept at top level because `_slot`,
# `test_block_table_contract` and `validate_geometry` all read the
# single-sequence pin and sequence 0 is what they describe. NON-IDENTITY
# everywhere (`page_ids[i] != i`), and `validate_geometry` refuses anything else:
# over a page where `page_ids[i] == i` the slot equals the position, so a
# candidate that ignored `block_tables` and indexed the cache flat would
# reproduce `kv_cache_state.npz` exactly. Five ids because the run spans
# ceil((135 + 8) / 32) = 5 pages. Unchanged from `core_gpt_oss`.
