# THE NON-MONOTONIC WARM-UP ARRAY: FOUND HERE, FIXED HERE, RE-FROZEN HERE.
# Kept as a comment because the geometry below is what triggers it, and a reader
# changing `shares_prefix_with` needs to know what it used to cost.
#   file:  tests/golden/battery/batch_composition/d1p2/inputs.npz
#   was:   warmup_query_start_loc = [0, 134, 102, 102]   <-- NON-MONOTONIC
#   now:   warmup_query_start_loc = [0, 134, 134, 134]
#          warmup_request_distribution [0, 2, 0] -> [0, 1, 0]
#   mechanism: the freezer's `compositions()` re-stages
#     sequence i with `{**seq, "stage": "decode" if i < k else "prefill"}`, which
#     LEAVES `shared_prefix_len` in the dict. The freezer's
#     `_build_batch` then read `warm_from = seq.get("shared_prefix_len") or 0`
#     (= 32) against a re-staged `start = 0` and appended `start - warm_from` =
#     -32 to `warm_q_lens`. The three arrays beside it (`warm_ids` / `warm_pos` /
#     `warm_slots`) were already EMPTY, because `tokens[32:0] == []` and
#     `range(32, 0)` is empty; only the LENGTH did the subtraction raw.
#   it is unavoidable at any GEOMETRY, which is why the fix is in the PRODUCER --
#     the trigger is any sequence carrying `shared_prefix_len` that
#     `compositions()` re-stages to `prefill`, which happens for index 1 at k=1
#     and for index 2 at k in {1,2}; index 0 cannot be the shared one
#     (`shares_prefix_with` must name an EARLIER index); and a shared-prefix
#     request is MANDATORY, because `_invariance_prefix_cache` returns
#     `supported: False` without one and `test_prefix_cache_invariance` is
#     collected on every chunked instance with `pytest.skip` forbidden.
#   the fix: `warm_from = min(int(seq.get("shared_prefix_len") or 0), start)`
#     in the freezer, cherry-picked from the
#     `chunked_qwen2` arm ("a re-staged sharing request must not
#     warm a negative range"), together with its producer-side refusal
#     `_assert_monotonic_query_start_loc`, which now fails the FREEZE
#     rather than letting a wrong golden grade green.
#   what it had cost: it is live input (`candidate.py.tmpl:1282` feeds
#     `warmup_query_start_loc` straight into the warm-up `AttentionMetadata`),
#     and freeze and grade used the SAME wrong array, so it passed as a silent
#     coverage hole rather than a red test.
#   what moved when it was re-frozen, MEASURED by `--check` before writing:
#     ONLY `d1p2` -- `warmup_query_start_loc` (max|d| 32, 2/4),
#     `warmup_request_distribution` (max|d| 1, 1/3) and that variant's
#     `prefill_forward.npz::logits` (max|d| 9.297, 200140/15483776).
#     `d2p1` and all four `chunk_boundary` variants: unchanged. No sibling can
#     move: only `chunked_llama3` and this instance declare `shares_prefix_with`
#     at all, and for every other sequence `min(0, start) == 0`.
#   STILL OPEN, NOT THIS INSTANCE'S TO FIX:
#     `chunked_llama3/tests/golden/battery/batch_composition/d1p2/inputs.npz`
#     ships `[0, 11, 3, 3]` -- the same defect at that geometry, on a golden
#     shipped via Git-LFS. Re-freezing it is a controller decision.
#   what is asserted here: every `*query_start_loc` in every frozen
#     `inputs.npz` is checked non-decreasing, and the offender set must be
#     EMPTY. 7 files, 14 arrays, 0 offenders.
# =========================================================================== #
