#
# Per-instance source of truth for tasks/chunked_gpt_oss.
# the freezer mirrors every value here into
# golden/meta.json; nothing per-instance is hardcoded in the grader. Every key is
# checked against the freezer's known instance keys, so a typo is a
# refusal rather than a silently-defaulted value.
#
# THE HARDEST CELL OF THE (mode x family) GRID: the `chunked` mode over the
# `gpt_oss` family. It is the grid's second `chunked` instance and the third
# `gpt_oss` one, and it is the first cell where the two hardest columns meet --
# the mode that adds partial prefill plus an automatic prefix cache, and the
# family that is MoE, MXFP4-quantised, sliding-window and YaRN-scaled.
#
# THE DESIGN IS A UNION, NOT A MERGE, and it is measured rather than asserted:
# `engine.py` and `cache/prefix_cache.py` are byte-identical to `chunked_llama3`'s
# (the gpt_oss family contributes ZERO bytes to `engine.py` --
# core_gpt_oss's is byte-identical to core_llama3's, on both sides), `attention/paged.py`
# is byte-identical to `ragged_gpt_oss`'s, and everything else is
# `core_gpt_oss`'s. What is genuinely merged is this file, the parity checks,
# and the two engine test suites.
mode: chunked
model: gpt_oss
model_name_or_path: openai/gpt-oss-20b

# gpt-oss-20b routes 4 of 32 experts per token and 19.1B of its 20.9B parameters
# live in them. `conftest._golden_facts` reads this off meta. FAMILY property --
# `chunked_llama3` does not declare it and `core_gpt_oss`/`ragged_gpt_oss` do.
is_moe: true

# --------------------------------------------------------------------------- #
# Precision. The serving tier, as for every instance in this class.
# --------------------------------------------------------------------------- #
precision_profile: bf16_native
dtype: bfloat16

# =========================================================================== #
# THE BANDS, MEASURED ON THIS INSTANCE'S OWN GOLDENS. Every value below carries
# its floor, its ratio and the surface that binds it. These values were
# inherited from ragged_gpt_oss, and of the six, ONE WAS WRONG --
# `argmax_margin: 0.1875` FAILED the worked reference on three checks -- and two
# were loose by more than 2x.
#
# THE INSTRUMENT is the class's own pytest
# plugin, run over this instance's own graded suite. It computes nothing itself:
# it wraps the graded gates (`test_numeric._assert_array_parity`,
# `_t2j._formulas.centered_cosine`, `_t2j.compare.check_logits_strict` over a
# margin ladder, `test_behavioral`'s four readers, `fixtures.Golden.decode_margins`)
# and records what they saw, so every number below came out of the function the
# grade itself calls. A numpy reimplementation was NOT written; this class has
# paid for that twice.
#
# RUN-TO-RUN SPREAD IS EXACTLY ZERO. Three full graded runs on one H100 host
# (the GPU idle at 1 MiB before each), 844.8 / 853.8 / 827.5 s, pins
# JAX_DEFAULT_MATMUL_PRECISION=highest and XLA_FLAGS=--xla_gpu_autotune_level=0:
# the three floors JSONs are BIT-IDENTICAL across all three runs.
# So "worst of three" and "the value" coincide, and the headroom below is
# carried for cross-IMPLEMENTATION variation rather than for run noise.
#
# ONE LEG, NOT THREE, AND THAT IS THIS BLOCK'S HONEST SCOPE LIMIT.
# `ragged_gpt_oss` measured three legs per surface -- T (torch-bf16 vs
# torch-fp32), J (jax-bf16 vs jax-fp32) and C (torch-bf16 vs jax-bf16) -- and
# set each band above max(T, J, C). ONLY THE C LEG WAS MEASURED HERE: the
# reference-as-candidate grade compares the jax port at bf16 against the frozen
# TORCH bf16 golden, which is exactly C and is exactly what the grade evaluates.
# T and J would need two extra fp32 forwards per surface and were not run. The
# consequence is stated per row: where tightening a band toward the C floor
# could put it BELOW the intrinsic bf16 envelope, the band is NOT tightened, and
# the row says so rather than quoting a ratio that looks tighter than the
# evidence.
# =========================================================================== #

# --------------------------------------------------------------------------- #
# THE FP32 TIER. On this tier both sides ARE fp32, so there is one definition
# and the only measurable leg is C -- the T/J caveat above does not apply here.
#
#   key                       floor (C)      declared    ratio   binding surface
#   abs_tol                   8.6090e-06     1.0e-04    11.62x   reference_units/
#                                                                lm_head/lm_head.out0
#   centered_cosine_floor     0.99999976     0.9999995   2.10x   fp32_prefill_logits
#                             (1-cos 2.384e-07 vs 5.0e-07)
#   logprob_atol              6.1750e-05     4.0e-04     6.48x   test_decode_
#                                                                trajectory
#   logprob_cumulative_atol   4.6110e-04     1.7e-03     3.69x   the 8-step sum
#   held_out_logprob_atol     7.3910e-05     7.5e-04    10.15x   test_held_out_
#                                                                logprobs, per token
#   held_out_seq_atol         6.6447e-04     4.0e-03     6.02x   held-out sequence
#
# EVERY VALUE IS UNCHANGED, and on this tier the agreement with `ragged_gpt_oss`
# is the EVIDENCE rather than the convenience. Four of the six gate probes that
# are single-sequence on EVERY mode (decode trajectory, held-out scoring), so
# chunking cannot reach them, and all four floors here reproduce that instance's
# to every digit it published: 6.1750e-05, 4.6110e-04, 7.3910e-05, 6.6447e-04,
# and the same 2.10x on the centred cosine. That is what "the mode does not move
# this surface" looks like when it is measured instead of asserted.
#
# `abs_tol` IS THE ONE THAT MOVED, and only in WHICH surface binds it.
# `ragged_gpt_oss` binds on `rotary_emb.out0` at 1.0985e-05 (9.1x); here the
# rotary unit needs only 2.1017e-07 and the binding surface is `lm_head.out0` at
# 8.6090e-06 (11.62x). Same declared value, tighter margin, different reason --
# quote the surface, not just the number.
fp32_thresholds:
  abs_tol: 1.0e-4
  centered_cosine_floor: 0.9999995
  logprob_atol: 4.0e-04
  logprob_cumulative_atol: 1.7e-03
  held_out_logprob_atol: 7.5e-04
  held_out_seq_atol: 4.0e-03

# --------------------------------------------------------------------------- #
# THE NATIVE (bf16 serving) TIER.
#
#   key                        floor (C)   declared  ratio   binding surface
#   argmax_margin              0.4375      0.5       1.143x  prefill_logits /
#                                                    (+1 ULP) ragged_forward_logits
#                                                            [request_1] /
#                                                            batch_composition
#                                                            _battery[d1p2]
#   decisive_margin            n/a         0.125     2.0x    smallest golden
#                                                            generation margin
#                                                            0.0625
#   centered_cosine_floor      0.98798239  0.983     1.41x   batch_composition
#                                                            _battery[d1p2]
#   centered_cosine_floor
#     .hidden_states           0.99126560  0.985     1.72x   hidden_24
#   abs_tol.kv_cache_state     3.7875      6.0       1.58x   kv_cache_state
#   abs_tol.hidden_states    240.0       600.0       2.50x   hidden_22
native_thresholds:
  # THE ONE INHERITED VALUE THAT WAS WRONG, and the reason this task exists on
  # this instance.
  #
  # AT ragged_gpt_oss's 0.1875 THE WORKED REFERENCE FAILS, on three checks, on
  # all three runs: test_prefill_logits, test_ragged_forward_logits and
  # test_batch_composition_battery. The measured floor -- the smallest ladder
  # rung at which `check_logits_strict` reports zero decisive disagreements --
  # is 0.4375 on all three.
  #
  # THE FLOOR IS 0.4375, NOT 0.5, AND THE FIRST ROUND'S 0.5 WAS A LADDER
  # ARTEFACT. The floor plugin's margin ladder jumps 0.375 -> 0.5;
  # it has no 0.4375 rung, so a floor of 0.4375 could only ever be REPORTED as
  # 0.5. Re-measured with the ladder widened to the bf16
  # ULP grid across [0.25, 0.75] (rungs 0.3125 / 0.4375 / 0.5625 / 0.625 /
  # 0.6875 added; the shipped rungs are a strict subset, so every number the
  # first round quoted is still directly comparable). The widening was done by
  # overriding the module constant from a throwaway plugin, NOT by editing
  # the floor plugin itself, which two other arms are live against.
  #
  # IT IS ONE ROW, AND IT IS r1's ROW 0 -- now isolated rather than narrowed to
  # two candidates. The three surfaces share a single stubborn disagreement:
  # `prefill_logits` (130 rows) and `ragged_forward_logits/request_1` (11 rows)
  # report the IDENTICAL token_kl 3.87745e-02, i.e. the same row, and r1's slice
  # is the intersection; `batch_composition_battery[d1p2]` (77 rows) contains
  # r1's full 43-token prefill and shows the same one.
  #
  # WHICH ROW, READ OFF THE LADDER. On `ragged_forward_logits/request_1` -- 11
  # rows, ZERO exact ties, so every row is its own gap -- `n_bad` is 1 at every
  # rung up to and including 0.375 and 0 at 0.4375, while `n_decisive` goes
  # 9 -> 8 across that step. Exactly one row leaves the decisive set there, and
  # its golden gap therefore lies in (0.375, 0.4375]. r1's eleven gaps are
  # [0.4375, 0.75, 2.5625, 1.25, 0.375, 1.6875, 0.9375, 0.25, 1.625, 0.5,
  # 2.0625]; the only value in that interval is row 0's 0.4375. ROW 9 (gap 0.5)
  # IS RULED OUT: `n_bad` is already 0 at 0.4375, below its gap. Row 0 is
  # absolute position 32 -- the FIRST token after the shared prefix, whose query
  # reads a page half of which the WARM-UP forward wrote and half of which the
  # GRADED forward did. It is the mode's most novel surface, which is the answer
  # the two-candidate version could only guess at.
  #
  # EVERY OTHER SURFACE IS CLEAN WELL BELOW THE DECLARED VALUE, re-read on the
  # same run: `chunked_prefill_logits` 0.0625, all four `chunk_boundary`
  # variants 0.0625 (`tail` 0.0), `ragged_forward_logits/request_0` 0.125,
  # `batch_composition_battery[d2p1]` 0.125. The first round said d2p1 was "at
  # or under 0.0625"; it is 0.125, and the correction is a MEASUREMENT rather
  # than a re-reading -- the three floors runs it cited FAILED (they ran at the
  # inherited 0.1875), so `test_ragged_forward_logits` aborted after request_1
  # and `test_batch_composition_battery` after d1p2, and neither `d2p1` nor
  # `request_2` appears in those artifacts at all. This round's run is green
  # (41 passed) and carries all 25 logit surfaces.
  #
  # IT IS A bf16 TIE-CLASS EVENT, NOT A PORT DEFECT, and that was established
  # before the value moved rather than assumed: on the FP32 tier the same 130
  # rows are compared at `argmax_margin: 0.0` -- every position, no latitude --
  # and `fp32_prefill_logits` reports ZERO argmax disagreements at raw cosine
  # 1.0000000 and token KL 1.74e-06. The disagreement exists only at bf16. The
  # mechanism is this family's, and `ragged_gpt_oss` measured it: 136 of
  # core_gpt_oss's 3240 (layer, token) pairs select a DIFFERENT SET OF EXPERTS
  # between the two references, every one at a 4th-vs-5th router-logit gap at or
  # below one bf16 ULP, and a flipped token runs a genuinely different expert --
  # a percent-level change, not a last-bit one. What is new here is the SIZE:
  # core_gpt_oss's three disagreements and ragged_gpt_oss's five all sit at a
  # golden gap of 0.0625, where this one sits four to eight times higher.
  #
  # 0.5 = the measured floor 0.4375 PLUS ONE bf16 ULP at the binding row's
  # magnitude (|logit| in [8,16) -> ULP 0.0625), i.e. RATIO 1.143x. That is the
  # same rule the first round stated; applying it to the corrected floor is what
  # moves the key. 0.5625 was floor + TWO ULP once the floor was resolved, and
  # left this instance holding the loosest `argmax_margin` in the class at 3x
  # every other one, defended by a rung the ladder could not see below.
  # Not 1.5x of the floor the way ragged_gpt_oss took 0.1875 over 0.125: 1.5x is
  # 0.65625, which is not on the bf16 grid at this magnitude and rounds up to
  # 0.6875 -- looser than the value being replaced, for headroom nothing
  # measured asks for.
  #
  # WHAT IT COSTS, counted rather than waved at -- decisive positions (golden
  # gap > margin), at the inherited value, at the measured floor, at the
  # declared value, and at the value this round replaces:
  #                              @0.1875  @0.4375  @0.5   @0.5625  (total rows)
  #     prefill_logits              105      88      85      84       130
  #     ragged_forward request_0     93      79      77      76       118
  #     ragged_forward request_1     11       8       7       7        11
  #     ragged_forward request_2      1       1       1       1         1
  #     chunked_prefill_logits       93      79      77      76       118
  #     batch_composition d1p2       67      54      52      49        77
  #     batch_composition d2p1       30      24      24      23        35
  #     chunk_boundary aligned       81      69      68      67       103
  #     chunk_boundary far_interior  80      68      67      66       102
  #     chunk_boundary interior      93      79      77      76       118
  # Summed over those ten surfaces: 654 decisive positions at 0.1875, 549 at the
  # floor, 535 at the declared 0.5, 525 at the 0.5625 this replaces. So relative
  # to the inherited value the move costs 18.2% of the graded argmax positions
  # (19.7% at 0.5625) -- it BUYS BACK 10 of them against 0.5625. It
  # costs NO other clause: `cosine_ok` and `kl_ok` inside the same
  # `check_logits_strict` call are untouched, and the FP32 tier still grades
  # every one of these rows' top-1 exactly at margin 0.0.
  #
  # THE ALTERNATIVE WAS CONSIDERED AND NOT TAKEN, and it is recorded because it
  # is the one thing a reader would otherwise ask. r1 is the only request on this
  # instance that is not a family constant -- r0 and r2 are shared byte-for-byte
  # with core_gpt_oss and ragged_gpt_oss -- so its tail COULD be re-picked from
  # the three alternatives recorded beside `sequences` below, at the cost of a
  # full re-freeze and a re-screen. It was not, for two reasons. (a) All three
  # alternatives begin with token 261 (" a"), which is ALSO r0's token 32, so
  # each of them would make a 32-token share indistinguishable from a 33-token
  # one -- the property this tail was chosen for. (b) Re-picking is a lottery
  # against a bf16 tie, not a fix: nothing about a different tail makes an
  # expert flip less likely, so it would trade a measured, documented band for
  # an unmeasured one. If a future round wants 0.1875 back, the honest route is
  # a tail screened FOR this property, not a re-roll.
  argmax_margin: 0.5
  # SEQUENCE-LEVEL decisiveness for `test_greedy_sequence`. NO FLOOR IS
  # MEASURABLE FOR THIS KEY ON A CORRECT PORT -- the reference's native and fp32
  # tokens both match the golden exactly on all three runs, so the excusing
  # branch never executes. Same situation `ragged_llama3` and `ragged_gpt_oss`
  # record.
  #
  # WHAT IS MEASURABLE is the generation-aligned golden margin array, read out of
  # `fixtures.Golden.decode_margins` by the instrument:
  #     [1.375, 0.0625, 1.375, 0.5625, 0.1875, 1.25, 0.0625, 1.3125]
  # -- BYTE-IDENTICAL to `ragged_gpt_oss`'s, which is the expected result and is
  # quoted as a check rather than a coincidence: `generation_probe` is
  # single-sequence over the top-level 135-token prompt on the same checkpoint,
  # so neither the ragged batch nor the chunk split can reach it.
  #
  # The smallest is 0.0625, HALF the declared margin, so steps 1 and 6 sit at a
  # genuine one-ULP tie and a divergence at either is EXCUSED by design. This
  # check therefore grades 6 of 8 steps on this instance, not 8 of 8. Lowering
  # the key to grade them would convict a correct port on a coin flip.
  decisive_margin: 0.125
  # THE LOGIT CENTRED COSINE. UNCHANGED at ragged_gpt_oss's 0.983, and now
  # measured: floor 0.987982392 at `batch_composition_battery[d1p2]` -- a
  # battery variant, not the canonical prefill, exactly as on that instance.
  # 1 - 0.983 = 0.017 against a measured 1 - cos = 1.202e-02, i.e. 1.41x.
  #
  # THAT IS BELOW THE CLASS'S 1.64x CONVENTION AND IT IS LEFT THERE ON PURPOSE.
  # Meeting 1.64x would mean declaring 0.980, i.e. WIDENING a band that admits
  # the reference on three bit-identical runs, to buy headroom no measurement
  # asks for. The convention exists to cover run-to-run and cross-implementation
  # spread; the run-to-run half is measured at exactly zero here. The
  # cross-implementation half is the T/J legs this instance did not run, so 1.41x
  # is recorded as the honest ratio rather than dressed up to 1.64x by moving the
  # number. If a real candidate ever lands between 0.98798 and 0.983 this is the
  # row to re-open, and it will be re-opened with a reading rather than a rule.
  #
  # The next-worst logit surface is `chunked_prefill_logits` at 0.996044874, so
  # the battery is 3.3x closer to the floor than anything the canonical scenario
  # produces -- the same shape ragged_gpt_oss found, one battery axis earlier.
  centered_cosine_floor: 0.983
  # THE RESIDUAL STREAM'S OWN FLOOR, and this key is TIGHTENED 0.95 -> 0.985.
  #
  # Floor 0.991265595 at hidden_24 (1 - cos = 8.734e-03). At the inherited 0.95
  # the ratio was 5.72x -- an inherited number carrying five times the headroom
  # its own surface needs, which is the "invisible looseness" half of the
  # threshold-calibration trap rather than the "absent key" half. 0.985 is
  # 1 - 1.5e-02, i.e. 1.72x, the 1.64x rule rounded to the nearer thousandth.
  #
  # The mechanism is the family's and it survives the mode change: the stream
  # runs to a peak of 9216 and the FINAL NORM collapses it, so hidden_24 is the
  # worst layer -- but only just. hidden_12 reads 0.991416991 and hidden_15
  # 0.992470384, so on this instance the middle of the stack is nearly as tight
  # as the end, where on `ragged_gpt_oss` hidden_24 stood alone at 0.969563
  # against >= 0.984785 everywhere else. This band is therefore set by the WHOLE
  # stream here, not by one layer.
  #
  # ONE LEG ONLY (see the block header): if the J leg were looser than C the way
  # it is on `ragged_gpt_oss` (0.969532 vs 0.969563, a 3e-05 gap), 0.985 still
  # clears it comfortably. This is the tightening the single-leg caveat does NOT
  # block, because the two legs agree to five digits on the parent.
  centered_cosine_floor.hidden_states: 0.985
  # THE KV CACHE BAND, TIGHTENED 9.0 -> 6.0.
  #
  # Floor 3.7875, binding on the whole `kv_cache_state` array at max|d| 4.19727
  # against max|ref| 157.0 (the floor is max(|d| - rel_tol*|ref|), NOT max|d| --
  # they differ by 0.41 here).
  #
  # THIS INSTANCE IS MUCH TIGHTER THAN ITS MODE-SIBLING AND THE REASON IS THE
  # WARM-UP POPULATION. `ragged_gpt_oss` needed 6.6203 on its own C leg and every
  # one of its three binding elements sat in the 161 warm-up slots of its
  # 130-token window-crossing decode request. This scenario's warm-up writes
  # only 49 slots -- r0's chunk 1 (17) and r2's prefix (32) -- because r1 writes
  # NONE (it borrows r0's page 3 outright) and r0's own tail is graded rather
  # than warmed. Fewer warm-up slots, and none of them 129 positions deep, is
  # why the same family's cache disagrees 1.75x less here.
  #
  # 6.0, AND THE RULE IS STATED BECAUSE ONLY ONE LEG WAS MEASURED. bf16 ULP at
  # the cache peak 157.0 is exactly 1.0, so the ladder here is integral.
  # `ragged_gpt_oss` measured its own inter-leg spread (J - T) at 1.9234 on this
  # exact surface and this exact checkpoint; adopting that as the allowance
  # rather than fitting one gives 3.7875 + 1.9234 = 5.7109, and 6.0 is the
  # nearest integral-ULP rung at or above it. Ratio 1.58x on the leg that was
  # measured. NOT 4.0 (the rung just above the bare floor): at 1.056x it would
  # sit inside the T/J spread the parent measured and would be a flake.
  #
  # The occupancy clause of `test_kv_cache_write` is exact and untouched by any
  # of this; it sees a paging bug independently of the value clause.
  abs_tol.kv_cache_state: 6.0
  # THE RESIDUAL STREAM'S ABSOLUTE BAND. UNCHANGED at 600.0, and this row is the
  # one where the single-leg caveat BINDS.
  #
  # Floor 240.0 at hidden_22 (max|d| 544 against max|ref| 9216, cap_scale 1.0),
  # so 600.0 carries 2.50x on the C leg. That looks like room to tighten and it
  # is NOT, because the C leg is the wrong leg for this surface: on
  # `ragged_gpt_oss` the envelope was set by TORCH's own bf16 error (T 521.3142)
  # at 1.87x its cross leg (C 278.4000), and `core_gpt_oss` measured the same
  # shape (542.15 / 534.15 / 278.40). If that ratio holds here the intrinsic
  # envelope is ~450 and anything below it demands the two frameworks agree with
  # each other more closely than either agrees with its own fp32 run. 600.0 is
  # kept, and the honest statement is "2.50x of the ONE leg measured, retained
  # because the leg that sets this band on both sibling instances was not".
  #
  # THE SHALLOW END IS NOT BINDING HERE, which is a change from
  # `ragged_gpt_oss`. `_shallow_abs_cap` rescales the declared value by
  # `min(1, 4*running_peak_i/global_peak)`, so the value each layer really
  # demands is `floor_i / cap_scale_i`. Measured across all 25:
  #     hidden_22  floor 240.00  scale 1.000000  -> needs 240.00
  #     hidden_17  floor 113.80  scale 0.761905  -> needs 149.36
  #     hidden_19  floor 141.60  scale 1.000000  -> needs 141.60
  #     hidden_23  floor 133.85  scale 1.000000  -> needs 133.85
  #     hidden_15  floor  44.93  scale 0.439153  -> needs 102.30
  # -- the deepest layer is also the binding one, and no rescaled shallow layer
  # comes within 1.6x of it. `ragged_gpt_oss` reported the opposite (its shallow
  # hidden_6 needed 3.11x of the 4.0 constant, a new worst for the class); this
  # scenario does not reproduce that, and the declared value may fall to 240.0
  # before any layer, shallow or deep, stops admitting the worked reference.
  abs_tol.hidden_states: 600.0

# WHAT NEITHER BAND DECLARES, MEASURED ANYWAY SO THE OMISSION IS NOT INVISIBLE.
# `NumericThresholds` has three more fields -- `rel_tol`, `cosine_floor`,
# `max_kl` -- and no instance in this class declares one, so all three fall back
# to the CLASS PROFILE. That fallback is the exact shape of the trap this block
# exists to close, so the floors are recorded even though the values are not
# moved:
#
#   band     key            profile value   measured floor          headroom
#   native   cosine_floor   0.98            0.999597728 (RAW          49.72x
#                                           cosine, d1p2 battery)
#   native   max_kl         0.1             7.608535e-02 (d1p2)        1.314x
#   native   rel_tol        0.1             carried in every abs_tol row above
#   fp32     cosine_floor   0.999999        1.0000000 (fp32 prefill)  >1e6 x
#   fp32     max_kl         1.0e-4          1.7433e-06                57.4x
#   fp32     rel_tol        1.0e-3          carried in `abs_tol`'s row above
#
# THE TWO NATIVE ROWS ABOVE WERE RE-READ AFTER d1p2 WAS RE-FROZEN under the
# warm-up clamp (see the `sequences` block), because d1p2 is what binds them:
# the RAW cosine moved 0.999598861 -> 0.999597728 and `max_kl` did not move at
# all. That the raw cosine moved at all is the direct evidence that the graded
# suite is reading the NEW golden; every other floor on this instance -- centred
# cosine, all six `abs_tol` rows, all four logprob rows -- is bit-identical
# across the re-freeze.
#
# `native max_kl` AT 1.314x IS THE TIGHTEST THING ON THIS INSTANCE, DECLARED OR
# NOT, and it is tighter than the 2.14x `ragged_gpt_oss` flagged as the tightest
# on its own. `check_logits_strict` applies the KL clause BINDING (no
# `_KL_COSINE_OVERRIDE`), so 0.1 is a live gate sitting 31% above the measured
# 7.609e-02 -- and the binding surface is `batch_composition_battery[d1p2]`, a
# battery variant that only `ragged` and above have. The canonical
# `prefill_logits` reads 3.88e-02 (2.58x) and `chunked_prefill_logits` reads
