# The K sweep. FOUR legs -- three fitting points once `fit_step_time`
# drops call 1, the minimum at which it has a degree of freedom to see a bad call
# in. `num_decode_steps` (8) MUST be one of these four: `perf_probe` samples
# `tokens` -- the work gate's subject -- only on that leg, and the gate silently
# gets `None` if the coupling breaks.
#
# Feasibility, sized off the TOP-LEVEL `prompt_len` / `page_size` (`perf_probe`
# runs a single-sequence `Engine.generate` over sequence 0, not the mixed batch
# below and not `chunk_split_points`): ceil((135 + 16) / 32) = 5 <= pages_per_seq
# (6), and 135 + 16 = 151 <= max_model_len (160).
# the harness enforces both, per instance.
perf_k_values: [2, 4, 8, 16]

# NO `perf_graded` AND NO `perf_thresholds`, DELIBERATELY, and this is a choice
# rather than an omission -- both keys are in `INSTANCE_KEYS` and an instance may
# set them. `perf_thresholds.delta` is UNCALIBRATED CLASS-WIDE: no instance in
# this class declares one (verified across all ten shipped instances), and
# pinning a speed ratio would need a multi-GPU study this instance does not
# have. Absent reads as `perf_graded: false` through `_golden_facts`'
# `bool(meta.get(...))`, which deselects `test_decode_speed` and relieves
# `_harness_checks.check_every_threshold_consumer_has_a_key` of demanding a
# `perf_thresholds` key.

# --------------------------------------------------------------------------- #
# THE CANONICAL PROBE -- sequence 0, and the SAME 135 tokens `core_gpt_oss` and
# `ragged_gpt_oss` freeze. The generation, decode-step, sampler, serve and
# held-out probes are single-sequence on every mode, so holding this prompt fixed
# is what makes the three gpt_oss instances comparable along the mode axis.
