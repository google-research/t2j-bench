# while `golden/sampler.npz` is absent, which is why they could not run when the
# grid was written:
#     test_no_sampler_grid_point_cuts_inside_a_tie[chunked_gpt_oss]
#     test_no_top_p_boundary_collides_at_bf16[chunked_gpt_oss]
#     test_the_sampler_grid_makes_chain_ORDER_observable[chunked_gpt_oss]
#     test_no_two_sampler_grid_points_grade_the_same_thing[chunked_gpt_oss]
#
# ONE KNOWN, UNREPAIRED FINDING, INHERITED AND REPRODUCED TO THE DIGIT. The tool
# exits 1 and prints `{1.0, 0, 0.812}: UNSAFE`, and the verdict comes entirely
# from the PARITY row -- the standalone single-sequence prefill the parity checks
# transform, NOT the row the grade uses. On that row 0.812 cuts inside a bf16
# tie at logit 8.625 (native, ulp 0.00) and its fp32 slack is 27.7 against the
# tool's SLACK_FLOOR of 50. On the GRADED row the same point is clean and wide:
# 4 survivors, no tie at either precision, slack 41069.6.
# THESE ARE `ragged_gpt_oss`'s NUMBERS, ARRIVED AT INDEPENDENTLY -- 8.625, 27.7,
# 4 survivors, 41069.6, all four identical -- which is the expected result once
# the mechanism is named: the parity row is the standalone prefill of the
# top-level 135-token prompt, and that prompt is a FAMILY constant this instance
# shares byte-for-byte with both gpt_oss siblings. The mode cannot move a
# single-sequence row. Left as-is by the same ruling that instance recorded: the
# exposure is a latent tie-break in the AUTHORING gate, not in the grade;
# the parity checks pass 23/23 at this value here; and that instance already swept
# [0.78, 0.86] for a replacement and found only 0.78 and 0.79 clean, both of
# which drop the graded row from 4 survivors to 3. The repair is not free and
# the defect is not graded.
# =========================================================================== #
sampler_grid:
  - {temperature: 1.0, top_k: 0, top_p: 1.0}
  - {temperature: 0.7, top_k: 50, top_p: 1.0}
  - {temperature: 1.0, top_k: 0, top_p: 0.812}   # top_p alone
  - {temperature: 0.0, top_k: 0, top_p: 1.0}     # the division-by-zero point
  - {temperature: 1.0, top_k: 50, top_p: 0.900}  # top-k AND top-p co-active
  - {temperature: 0.7, top_k: 0, top_p: 0.95}    # temperature AND top-p co-active
logprobs_top_n: 5

# Hard wall-clock budget (seconds) for THE WHOLE CANDIDATE SANDBOX -- not,
# despite the name, for the candidate's generate() loop. It bounds the single
# worker spawn that runs every probe in `REQUIRED_PROBES`: both prefills, decode,
# both generations, serve.py::_build, held-out scoring, the batteries and the
# invariances.
#
# 3600, which is the FAMILY's value (both gpt_oss instances) and not
# `chunked_llama3`'s 900 and not the class's 1800. `core_gpt_oss` measured
# 525.36 s of in-container graded pytest on an idle host and raised this to match
# `[verifier] timeout_sec`, the largest it can usefully be. This instance is
# `ragged_gpt_oss` plus four checks, a second battery axis (four more frozen
# variants) and `chunked_prefill_probe`'s extra `Engine.prefill`, so it is
# strictly slower than either parent.
generate_timeout_s: 3600

compare_hidden_states: true

# THE GRADED DENOMINATOR: how many checks survive collection on this instance.
# Per-instance -- a different mode deselects a different set -- and it does NOT
# follow from anything else in this file, so it is declared rather than derived.
#
# 41 = `core`'s 33 plus the EIGHT checks `conftest._APPLICABLE` (:844-855) opens
# on this mode's predicates:
#   test_ragged_forward_logits      has_ragged
#   test_batching_invariance        has_ragged
#   test_no_cross_sequence_leakage  has_ragged
#   test_batch_composition_battery  has_ragged and has_battery_batch_composition
#   test_chunked_prefill_logits     has_chunked
#   test_chunking_invariance        has_chunked
#   test_prefix_cache_invariance    has_prefix_cache (== has_chunked)
#   test_chunk_boundary_battery     has_chunked and has_battery_chunk_boundary
# `_APPLICABLE` carries no MoE/family gate, and the shipped counts confirm the
# axes are additive (core 33 on both families, ragged 37 on both), which is why
# 41 is `chunked_llama3`'s count too.
#
# READ BY the oracle grading run, which asserts `n_passed == graded_checks` beside
# `reward == 1.0`, and by `conftest._instance_graded_check_count` in-container,
# which floors the collected count against it. Verified against the real grade
# rather than believed.
graded_checks: 41

# Authoring-host paths. NOT mirrored into meta.json.
torch_orig: ../environment/torch_orig
jax_repo: ../solution/ref_jax_repo
golden_dir: golden
