# THE THREE REQUESTS. Own-page sets {3,0,5,1,7}, {9} and {14,13} are pairwise
# disjoint, all < 24, and every RESOLVED list is non-identity (r1 resolves to
# [3, 9]: 3 != 0 and 9 != 1).
