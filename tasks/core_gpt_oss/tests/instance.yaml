#     .encode(text, add_special_tokens=False).ids
# and NO bos prepended, unlike core_llama3's 128000: gpt-oss's special tokens
# are the harmony chat frame, and a bare completion prompt is what this probe
# is. The text is a plain factual continuation, chosen so the greedy trajectory
# is decisive enough for `test_greedy_sequence` to be a real comparison:
#
#   "The capital of France is Paris, and the capital of Japan is Tokyo. Rivers
#    shape the cities built beside them: the Seine divides Paris into a left
#    bank and a right bank, the Thames runs east through London to the sea, and
#    the Danube passes through four national capitals on its way from the Black
#    Forest to the Black Sea. A river is also a boundary, a trade route, and a
#    source of drinking water, which is why so many of the oldest settlements
#    in Europe and Asia were founded on one. Bridges, ferries and embankments
#    followed, and then the maps and the customs houses. The list of such river
#    cities is long, and it begins with"
prompt_token_ids: [976, 9029, 328, 10128, 382, 12650, 11, 326, 290, 9029, 328,
  10198, 382, 40510, 13, 54825, 9591, 290, 15636, 8113, 49662, 1373, 25, 290,
  74722, 144028, 12650, 1511, 261, 3561, 6922, 326, 261, 1849, 6922, 11, 290,
  131859, 13719, 23557, 1819, 9741, 316, 290, 9624, 11, 326, 290, 8156, 4502,
  29169, 1819, 4242, 7769, 173420, 402, 1617, 2006, 591, 290, 7613, 29632, 316,
  290, 7613, 22114, 13, 355, 20608, 382, 1217, 261, 35021, 11, 261, 10552, 9656,
  11, 326, 261, 4256, 328, 24947, 3411, 11, 1118, 382, 4436, 813, 1991, 328,
  290, 34331, 95652, 306, 6267, 326, 16363, 1504, 24303, 402, 1001, 13, 135580,
  11, 37316, 566, 326, 6588, 1104, 1626, 12661, 11, 326, 1815, 290, 24267, 326,
