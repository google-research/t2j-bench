# --------------------------------------------------------------------------- #
# Probe configuration. Identical to core_llama3's except for ONE number, and the
# rest are held fixed on purpose -- they are per-CLASS choices, not per-family
# ones, and holding them fixed is what makes the two instances' measured bands
# comparable.
# --------------------------------------------------------------------------- #
# THE ONE NUMBER: grid 2 is `top_p 0.905`, not core_llama3's 0.9, and this is the
# same phenomenon that already made grid 4 `0.85` there ("must not be tightened
# to 0.9"). At 0.9 the nucleus cut on THIS row lands strictly INSIDE a tie:
#
#   frozen logits are bf16 values, so they quantise to a 0.03125 grid at this
#   scale, and 215 of the top 300 are duplicates of another. p = 0.9 keeps 267
#   tokens -- 263 strictly above the boundary logit 6.65625, plus 4 OF THE 10
#   TOKENS THAT HOLD IT.
#
# Which 4 is decided by `argsort`'s tie-break over equal keys, and torch's and
# JAX's are different. That is not a tolerance question and no band can fix it:
# the surviving SET is compared exactly and correctly so (an off-by-one in the
# cumulative scan must fail), and a tie-break is not a cross-framework quantity
# any more than a Philox draw is.
#
# 0.905 keeps 299 tokens, and the boundary group of 6 is kept WHOLE on either
# side. Chosen by margin, not by trying values: the fp32 cumulative-sum error on
# this row measures 2.599e-06, and 0.905 clears the crossing by 6.32e-05 below
# and 8.59e-05 above -- 24x. The nearby alternatives are worse (0.890 clears by
# only 5.76e-06, 2x) or move the nucleus much further (0.920 keeps 433). Grid 4
# and grid 5 were re-checked at the same time and both already cut cleanly, with
# a boundary group of exactly 1. THAT CHECK IS STILL CORRECT AND IS NOT WHAT
# MOVED GRID 5 BELOW: a boundary group of 1 means the two straddling tokens are
# fp32-DISTINCT, with no argsort tie-break involved -- criterion 4 (bf16
# rank-adjacency) is an ORTHOGONAL, DEEPER
# check: it asks whether those two distinct fp32 values still round to the
# SAME bf16 bucket once temperature-scaled, which is a question a boundary-group
# count of 1 cannot answer.
#
# GRID 5 AT 0.9 FAILED CRITERION 4, MEASURED, NOT BY INSPECTION: the cut sits
# between kept token logit 11.5 and dropped token logit 11.4375 (a clean 0.0625
# fp32 gap, criterion 2/3-clean exactly as the paragraph above found). Dividing
# by this row's temperature (0.7) manufactures the collision downstream:
# 11.5/0.7 = 16.428572 and 11.4375/0.7 = 16.339286 remain fp32-distinct but both
# round-to-nearest-even to the identical bf16 value 16.375 -- a bf16-native port
# cannot tell which one the reference kept. The collision is not a single point:
# it persists for every top_p in roughly [0.899, 0.908], because the SAME token
# pair sits at the cut throughout that whole range. 0.897 clears it with 24x the
# fp32 margin floor (1.03e-3 against the 5.0e-5 floor `test_no_sampler_grid_
# point_cuts_inside_a_tie` requires) and was verified, not assumed, to preserve
# the property the next paragraph documents.
#
# GRID 5's OWN COVERAGE, measured directly rather than inherited: grid 5 is the
# SOLE grid point where reordering the transform chain
# to apply temperature AFTER top_p changes anything at all -- 264 cells move at
# the original 0.9, 248 at 0.897, versus 0 at every other grid point including
# grid 4 (whose own order-sensitivity, top_p BEFORE top_k, is unaffected by
# this change: 37 cells, unchanged). Moving top_p to 0.897 keeps that property
# intact; it does not merely avoid destroying it by accident.
sampler_grid:
  - {temperature: 1.0, top_k: 0, top_p: 1.0}
  - {temperature: 0.7, top_k: 50, top_p: 1.0}
  - {temperature: 1.0, top_k: 0, top_p: 0.905}  # 0.9 cuts inside a 10-way tie
  - {temperature: 0.0, top_k: 0, top_p: 1.0}
  - {temperature: 1.0, top_k: 50, top_p: 0.85}  # top-k AND top-p co-active
  - {temperature: 0.7, top_k: 0, top_p: 0.897}  # temperature AND top-p co-active;
    # 0.9 crossed a bf16 rank-adjacency collision (criterion 4) at this row's
    # temperature scaling -- see the block comment above `sampler_grid`.
logprobs_top_n: 5

# 3600 s. The perf stage runs INSIDE the one batched sandbox worker this budget
# bounds (`Candidate._timeout`), and with its rounds added the in-container
# graded pytest measured 525.36 s on an otherwise-idle host. 3600 matches
# `[verifier] timeout_sec` -- the largest this budget could ever usefully be,
# since the container's own hard kill fires no later than that regardless --
# which leaves the same 6.85x headroom over that reading. One JAX generation leg
# is a prefill plus eight decode steps over a 20.9B model that dequantises its
# experts inside every forward.
generate_timeout_s: 3600

compare_hidden_states: true

# The graded denominator, observed from the oracle grading run.
graded_checks: 33

# Authoring-host paths. NOT mirrored into meta.json.
torch_orig: ../environment/torch_orig
jax_repo: ../solution/ref_jax_repo
golden_dir: golden
